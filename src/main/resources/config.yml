# CamFly - Konfiguration
# Neu laden mit /cam reload.
# Ungültige Werte werden in der Konsole gemeldet und ersetzt.

# Texte, die das Plugin ausgibt (Farbcodes mit &)
messages:
  actionbar-off: "&cCam mode ended"
  actionbar-on: "&aCam mode activated"
  armorstand.name-format: "&e{player}'s Body"
  body-attacked: "&cYour body was attacked by {damager}! Camera mode ended."
  body-drowning: "&cYour body is drowning! Camera mode ended."
  body-env-damage: "&cYour body was damaged by {cause}! Camera mode ended."
  # {effect} = Minecraft-Name des Effekts, z. B. poison
  body-got-effect: "&cYour body was hit by the effect {effect}! Camera mode ended."
  body-moved: "&cYour body was moved! Camera mode ended."
  body-suffocating: "&cYour body is stuck and suffocating! Camera mode ended."
  bossbar-text: "Cam mode ends in: %time%"
  # {area} = die verbotene Dimension, das Biom oder die Struktur
  cam-area-limit: "&cYou cannot go any further, cam mode is not allowed in {area}."
  cam-area-start: "&cYou cannot start cam mode in {area}."
  # {effect} = die Effekte, die den Start verhindern, mit Komma getrennt
  cam-effect-start: "&cYou cannot start cam mode with {effect} on you."
  cam-safety: "§cYou cannot start cam mode! You must remain safe for %seconds% more seconds."
  cam-spectator-start: "&cYou cannot start cam mode in spectator mode."
  camera-off: "&aCamera mode ended."
  camera-on: "&aCamera mode activated! Use /cam again to exit."
  cant-attack-other-body: "&cYou cannot attack other bodies in camera mode."
  cant-fly-in-lava: "&cYou cannot fly through lava! Camera mode will be ended."
  # Fehler in dieser Datei - immer in der Konsole,
  # bei /cam reload auch im Chat (siehe message-settings.config-errors).
  # Ist die Datei gar nicht lesbar:
  #   bei /cam reload  -> config-broken, die alten Einstellungen bleiben
  #   beim Serverstart -> config-broken-startup und config-start-failed,
  #                       das Plugin startet nicht
  config-broken: "&cDie Konfiguration hat einen Fehler und wurde nicht übernommen, es gelten weiter die bisherigen Einstellungen: {error}"
  config-broken-startup: "&cDie Konfiguration hat einen Fehler: {error}"
  config-start-failed: "&cStart fehlgeschlagen. Zum Aktivieren den Fehler in der Konfiguration beheben und den Server neu starten."
  config-entry-in-both-lists: "&cDer Eintrag '{value}' steht in {path} und in {other}. Er wird in keiner der beiden beachtet."
  config-error-header: "&cDie Konfiguration hat {count} ungültige Stellen:"
  config-error-header-single: "&cDie Konfiguration hat eine ungültige Stelle:"
  config-error-more: "&c... und {count} weitere. Alle stehen in der Server-Konsole."
  config-expected-boolean: "&cFalscher Wert für {path}: '{value}'. Erwartet wird true oder false. Es wird {used} verwendet."
  config-expected-list: "&cFalscher Wert für {path}: '{value}'. Erwartet wird eine Liste. Es wird {used} verwendet."
  config-expected-number: "&cFalscher Wert für {path}: '{value}'. Erwartet wird eine Zahl. Es wird {used} verwendet."
  config-expected-text: "&cFalscher Wert für {path}: '{value}'. Erwartet wird Text. Es wird {used} verwendet."
  config-too-small: "&cWert für {path} ist zu klein: {value}. Es wird {min} verwendet."
  config-unknown-entry: "&cUnbekannter Eintrag in {path}: '{value}'. Er wird nicht beachtet."
  config-unknown-value: "&cUnbekannter Wert für {path}: '{value}'. Erlaubt sind: {allowed}. Es wird {used} verwendet."
  cooldown-available: "&aCam mode available again"
  cooldown-text: "You can start cam mode again in %time%."
  # Grenze aus camera-mode.max-distance
  #   {distance} = erlaubte Entfernung
  #   {from}     = distance-from-body, in einer anderen Welt
  #                distance-from-portal
  distance-from-body: "your body"
  distance-from-portal: "the portal you came out of"
  distance-limit: "&cYou cannot move further than {distance} blocks from {from}!"
  hitbox.name-format: "&c[HITBOX] {player}"
  no-permission: "&cYou don't have permission to use this command."
  no-player: "&cThis command can only be used by players."
  no-projectiles: "&cYou cannot shoot projectiles in camera mode."
  # {portal} = nether oder end
  portal-blocked: "&cYou cannot go through {portal} portals in camera mode."
  # Spieler wurde hinter einem Portal zurückgeholt (Platzhalter wie oben)
  portal-return-area: "&cCam mode is not allowed in {area}, you were brought back."
  portal-return-distance: "&cYou ended up more than {distance} blocks away from {from} and were brought back."
  reload-exit: "&cCamera mode ended due to plugin restart."
  reload-start: "&ePlugin is restarting..."
  reload-success: "&aPlugin reload successful."
  # Zeilen in der Konsole beim Serverstart ("" = Zeile aus)
  # {error} = Grund des Fehlers
  startup-skins-failed: "Skins konnten beim Start nicht vorgeladen werden: {error}"
  startup-skins-loaded: "Skins wurden erfolgreich geladen."
  startup-skins-loading: "Skins werden geladen..."
  time-limit-expired: "&cCam mode ended: Time limit expired."

# Nachrichten einzeln an- und abschalten
message-settings:
  body-attacked: true
  body-drowning: true
  body-env-damage: true
  body-got-effect: true
  body-moved: true
  body-suffocating: true
  bossbar-text: true
  cam-area-limit: true
  cam-area-start: true
  cam-effect-start: true
  cam-safety: true
  cam-spectator-start: true
  camera-off: false
  camera-on: false
  cant-attack-other-body: true
  cant-fly-in-lava: true
  # Fehler dieser Datei im Chat bei /cam reload (Konsole immer)
  config-errors: true
  cooldown-available: true
  cooldown-text: true
  distance-limit: true
  # false = alle Nachrichten aus
  enabled: true
  no-permission: true
  no-player: true
  no-projectiles: true
  portal-blocked: true
  portal-return-area: true
  portal-return-distance: true
  reload-exit: true
  reload-start: true
  reload-success: true
  time-limit-expired: true

# Anzeige in der Action-Bar (Texte: actionbar-on, actionbar-off)
action-bar:
  enabled: true
  # Wie lange actionbar-off gesendet wird, in Ticks
  off-duration: 1

# Cam-Modus
camera-mode:
  # Entfernung zum Körper begrenzen
  max-distance-enabled: true

  # Maximale Entfernung zum Körper in Blöcken
  max-distance: 100.0

  # Sekunden zwischen zwei Warnungen an der Grenze
  distance-warning-cooldown: 3

  # Wer den Spieler im Cam-Modus sehen darf:
  #   cam   = nur Spieler, die selbst im Cam-Modus sind
  #   true  = alle
  #   false = niemand - er bleibt aber in der Tab-Liste, und getragene
  #           Ausrüstung wie der Kamera-Kopf bleibt sichtbar
  player_visibility_mode: true

  # Unsichtbarkeitseffekt im Cam-Modus
  # (bei player_visibility_mode: false immer an)
  allow_invisibility_potion: true

  # Leuchtender Umriss, damit andere den unsichtbaren Spieler sehen:
  #   true  = immer - auch durch Wände, verrät im PvP die Position
  #   false = kein Umriss
  #   sight = nur, solange ihn ein anderer Spieler direkt sieht;
  #           dann sehen den Umriss alle, auch durch Wände
  # Bei player_visibility_mode: false gibt es keinen Umriss.
  glowing-outline: true

  # Flug durch Lava (false = Lava beendet den Cam-Modus)
  allow_lava_flight: true

  # Spielmodus im Cam-Modus:
  #   adventure = Abenteuermodus
  #   survival  = Überlebensmodus
  #   creative  = Kreativmodus
  #   keep      = der aktuelle Modus bleibt
  # Blöcke, Inventar und Items bleiben in jedem Modus gesperrt.
  # Beim Beenden kommt der vorherige Modus zurück.
  # Aus dem Zuschauermodus startet der Cam-Modus nie.
  gamemode: adventure

  # Start mit Trankeffekten (sie pausieren im Cam-Modus):
  #   true     = mit allen
  #   false    = mit keinem
  #   positive = nur mit unschädlichen, z. B. Schnelligkeit, Leuchten
  start-with-effects: positive

# Körper, der im Cam-Modus an der Stelle des Spielers bleibt
# Ein Treffer auf den Körper beendet den Cam-Modus,
# ebenso eine Bewegung (siehe movement-sensitivity).
body:
  # Art des Körpers:
  #   1 = Rüstungsständer mit dem Kopf des Spielers
  #   2 = Mannequin mit dem Skin des Spielers
  type: 1

  # Name über dem Körper (Text: messages.armorstand.name-format)
  name-visible: true

  # Körper sichtbar (false = unsichtbar, der Name bleibt)
  visible: true

  # Rüstung des Spielers am Körper zeigen (nur Optik)
  # Typ 1 zeigt keinen Helm, dort sitzt der Kopf.
  armor-visible: true

  # Wodurch sich der Körper verschieben lässt:
  #   0 = durch nichts, er steht fest
  #   1 = durch Schwerkraft, Wasser und Kolben
  #   2 = zusätzlich durch Spieler und Mobs
  #       (nur bei type: 2, sonst gilt 1)
  movement-sensitivity: 1

  # Erlaubte Bewegung in Blöcken, bevor der Cam-Modus endet
  move-threshold: 0.05

  # Ob feindliche Mobs den Körper angreifen:
  #   vanilla = mit ihrer normalen Sichtweite (Zombie: 16 Blöcke)
  #   custom  = mit mob-target-radius, für alle gleich
  #   false   = nie
  # Nur bei freier Sicht auf den Körper.
  # Den Spieler selbst greift im Cam-Modus kein Mob an.
  mob-target: false

  # Reichweite in Blöcken für mob-target: custom (0 = kein Mob)
  mob-target-radius: 16.0

  # Mobkopf als Helm halbiert die Reichweite dieser Mobart,
  # wie in Vanilla (z. B. Zombiekopf gegen Zombies)
  mob-target-heads: true

# Zeitlimit für den Cam-Modus
time-limit:
  enabled: false
  # Wartezeit nach dem Beenden (auch ohne Zeitlimit)
  cooldowns-enabled: false
  # Maximale Dauer in Sekunden
  duration-seconds: 300
  # Wartezeit bis zum nächsten Start in Sekunden
  cooldown-seconds: 120
  # Restzeit als Bossbar anzeigen
  show-bossbar: true
  # BLUE, GREEN, PINK, PURPLE, RED, WHITE oder YELLOW
  bossbar-color: BLUE

# Partikel um den Spieler im Cam-Modus
camera-particles:
  # Höhe über den Füßen in Blöcken
  height: 0.2
  # Anzahl der Partikel pro Tick
  particles-per-tick: 0.1
  # Partikel auch dem Spieler selbst zeigen
  show-own-particles: false

# Feuerschutz im Cam-Modus: Der Spieler brennt nicht
fireguard:
  enabled: true
  # Feuer in der Nähe für den Spieler ausblenden
  hide-fire: true
  # Prüfintervall in Ticks
  tick-interval: 10
  # Suchradius für hide-fire in Blöcken
  radius-horizontal: 1.5
  radius-up: 2
  radius-down: 1

# Kamera-Kopf auf dem Spieler im Cam-Modus
# (auch bei unsichtbarem Spieler zu sehen)
camera-head:
  enabled: false

# Kein Cam-Modus direkt nach erlittenem Schaden
cam-safety:
  enabled: true
  # Wartezeit nach dem letzten Schaden in Sekunden
  delay: 5

# Wo der Cam-Modus erlaubt ist
cam-area:
  # Wie streng:
  #   0 = aus, die Listen werden nicht geprüft
  #   1 = nur beim Start
  #   2 = beim Start und im Flug - an der Grenze geht es nicht weiter
  level: 2

  # Sekunden zwischen zwei Meldungen an der Grenze (nur Stufe 2)
  warning-cooldown: 3

  # Biom-Liste beachten
  biomes-enabled: true

  # Verbotene Biome ([] = keine)
  # Biome aus Datenpacks mit Namensraum, z. B. meinpack:tiefe_hoehle
  forbidden-biomes:
    - lush_caves
    - dripstone_caves
    - deep_dark
    - sulfur_caves

  # Struktur-Listen beachten
  structures-enabled: false

  # Verbotene Strukturen, in zwei Listen:
  #   -box        = der ganze Bereich der Struktur, lückenlos
  #                 (für kompakte Bauten)
  #   -components = nur die einzelnen Bauteile, dazwischen frei
  #                 (für weitläufige Bauten wie die Netherfestung)
  # Jede Struktur nur in eine Liste, sonst wird sie ignoriert.
  forbidden-structures-box:
    - monument           # Ozeanmonument
    - swamp_hut          # Hexenhütte
    - pillager_outpost   # Pillager-Außenposten
  forbidden-structures-components:
    - mansion            # Waldanwesen
    - fortress           # Netherfestung
    - ancient_city       # Antike Stadt
    - trial_chambers     # Prüfungskammern
    - bastion_remnant    # Bastionsruine
    - end_city           # End-Stadt

  # Zwischenspeicher der Struktur-Prüfung in Chunks
  # (256 = etwa 50 KB; 0 = aus, kostet dann mehr Rechenzeit)
  # Neu platzierte Strukturen zählen erst nach /cam reload (bei 0 sofort).
  structures-cache-chunks: 256

  # Dimensionen, in denen der Cam-Modus erlaubt ist
  # Eigene Dimensionen von Plugins oder Datenpacks sperrt diese Liste nie.
  dimensions:
    overworld: true
    nether: false
    end: false

# Portale im Cam-Modus
# Gesperrt: Der Spieler bleibt, wo er ist; der Cam-Modus läuft weiter.
# In der anderen Welt zählt max-distance ab dem Portal, durch das er kam.
# Bei cam-area Stufe 2 zusätzlich:
#   verbotene Dimension -> Portal gesperrt, auch bei true
#   verbotenes Biom oder Struktur drüben -> Spieler wird zurückgeholt
portals:
  # Netherportal durchlassen (in beide Richtungen)
  nether: false

  # Endportal durchlassen (in beide Richtungen, End Gateway zählt nicht)
  end: false

  # Wohin ein Spieler zurückgebracht wird, der drüben zu weit weg
  # oder in einem verbotenen Gebiet landet:
  #   body   = zu seinem Körper
  #   portal = zum Portal, durch das er ging (wenn möglich, sonst body)
  return-to: body

  # Sekunden zwischen zwei Meldungen an einem gesperrten Portal
  warning-cooldown: 3

  # Portale merken, die in ein verbotenes Biom oder eine verbotene
  # Struktur führen (cam-area Stufe 2):
  #   true  = nach dem ersten Zurückholen bleibt das Portal gesperrt
  #   false = jedes Mal hin und gleich wieder zurück
  # Gemerkt wird bis zum Neustart oder /cam reload.
  remember-blocked: true

  # Wie viele Portale höchstens gemerkt werden (0 = keine)
  remember-blocked-count: 128

  # Gemerktes Portal wieder freigeben, wenn sich drüben etwas ändert:
  #   - das Portal dort ist abgebaut oder versetzt
  #   - die Stelle ist nicht mehr verboten
  #   - ein neues Portal steht in der Nähe (siehe forget-radius)
  # false = erst /cam reload gibt es frei
  forget-changed: true

  # Umkreis in Blöcken (waagerecht) um die Ankunftsstelle:
  # Ein neues Portal darin gibt ein gemerktes Portal frei.
  # 0 = aus. Sollte zu portal-search-radius des Servers passen.
  forget-radius: 128

# Treffer auf den Körper an den Spieler weitergeben
mirror-damage:
  # Schaden für den Spieler:
  #   mirror = wie der echte Treffer
  #   custom = fester Wert (custom-damage-hearts)
  #   false  = kein Schaden
  damage-mode: mirror

  # Schaden in Herzen für custom, plus Bonus durch Schärfe/Stärke
  # (0 = gar kein Schaden)
  custom-damage-hearts: 0.5

  # Ob Rüstung, Schutz-Verzauberungen und Effekte den Schaden mindern:
  #   true  = ja, wie bei einem echten Treffer
  #   false = nein, voller Schaden wie ohne Rüstung
  damage-counts-armor: true

  # Abnutzung der Rüstung des Spielers:
  #   mirror = wie beim echten Treffer
  #   custom = feste Punkte (custom-armor-damage)
  #   false  = keine Abnutzung
  damage-armor-mode: mirror

  # Haltbarkeitspunkte pro Treffer für custom (0 = keine)
  custom-armor-damage: 1

  # Unbreaking (Haltbarkeit) senkt die Abnutzung wie in Vanilla
  respect-unbreaking: true

  # Rückstoß für den Spieler, unabhängig vom Schaden
  knockback: true
