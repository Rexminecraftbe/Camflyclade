# CamFly - Konfiguration
# Neu laden mit /cam reload.
# Ungültige Werte werden in der Konsole gemeldet und ersetzt.

# Sprache der Texte, die das Plugin ausgibt: der Name einer Datei im Ordner lang, ohne .yml.
# Mitgeliefert wird nur en (lang/en.yml). Für eine andere Sprache lang/en.yml kopieren,
# z. B. als lang/de.yml, die Texte darin übersetzen und hier de eintragen.
language: en

# Anzeige in der Action-Bar
action-bar:
  enabled: true
  # Was dort steht, solange der Cam-Modus läuft:
  #   distance = wie weit der Körper weg ist und in welche Richtung, z. B. "Body: 42 blocks ↖"
  #              (Text: actionbar-distance in der Sprachdatei; zu Beginn steht für on-duration actionbar-on)
  #              Der Pfeil zeigt von der Blickrichtung aus. ▲/▼ = der Körper liegt steiler als 60° über/unter dir,
  #              ● = du bist höchstens 2 Blöcke von ihm weg.
  #              In einer anderen Welt zeigt er zum Portal, aus dem man kam (actionbar-distance-portal).
  #   text     = der feste Text actionbar-on, die ganze Zeit
  #   false    = nur zu Beginn actionbar-on mit dem Hinweis, für on-duration; danach verblasst die Zeile
  #              wie actionbar-off und es kommt nichts mehr
  # actionbar-on trägt den Hinweis, wie man den Cam-Modus beendet: mit der Taste (exit-key) oder /cam,
  # Text: actionbar-hint (bei exit-key: false actionbar-hint-command, nur /cam).
  # Warnungen (end-warning, body-alarm) und das Tempo des Mausrads kommen bei jeder Einstellung.
  display: distance
  # Wie lange zu Beginn actionbar-on mit dem Hinweis steht (bei distance, bevor der Abstand kommt, und bei false),
  # in Ticks: 20 = 1 Sekunde, 0 = gleich der Abstand (bei false: gar nichts)
  on-duration: 60
  # Wie lange actionbar-off gesendet wird, in Ticks
  off-duration: 1

# Cam-Modus
camera-mode:
  # Entfernung zum Körper begrenzen
  max-distance-enabled: true

  # Maximale Entfernung zum Körper in Blöcken
  max-distance: 100.0

  # Sekunden zwischen zwei Warnungen an der Grenze (auch an Lava, Wasser und Pulverschnee)
  distance-warning-cooldown: 3

  # Was an der Grenze von max-distance, cam-area (Stufe 2) und gesperrter Lava, Wasser, Pulverschnee passiert:
  #   barrier   = eine Wand, die nur der Spieler im Cam-Modus hat
  #   push-back = der Schritt wird abgebrochen, zurück auf die letzte Position
  #   false     = keine Grenze, auch hinter Portalen wird niemand zurückgeholt (gesperrte Lava, Wasser, Pulverschnee halten wie bei push-back)
  border-mode: barrier

  # Block der Wand: barrier ist unsichtbar, glass zeigt sie (Luft oder ein Block, durch den man durchkommt, z. B. Wasser oder Gras = keine Grenze)
  # Ganze Blöcke bleiben stehen, Luft und halbe Blöcke (Stufen, Zäune, Tropfstein ...) werden ersetzt.
  # Die Wand steht nur, wo die Kamera hinkommt: bei einem See z. B. an der Oberfläche, nicht am Grund und nicht im Fels.
  border-block: barrier

  # Block der Wand in Wasser, Lava und Pulverschnee (ein Block, durch den man durchkommt, z. B. water = wie border-block)
  border-block-water: blue_stained_glass
  border-block-lava: magma_block
  border-block-powder-snow: snow_block

  # Wie weit um den Spieler die Wand erscheint, in Blöcken (0 = keine Grenze)
  # Höchstens so weit, wie der Server die Welt schickt: view-distance aus server.properties mal 16.
  # Ein großer Radius kostet mehr: Die Wand wächst mit der Fläche der Grenze im Umkreis.
  border-radius: 5

  # Wer den Spieler im Cam-Modus sehen darf:
  #   cam   = nur Spieler, die selbst im Cam-Modus sind
  #   true  = alle
  #   false = niemand er bleibt aber in der Tab-Liste, und getragene  ausrüstung wie der Kamera-Kopf bleibt sichtbar
  player_visibility_mode: true

  # Unsichtbarkeitseffekt im Cam-Modus (bei player_visibility_mode: false immer an)
  allow_invisibility_potion: true

  # Leuchtender Umriss, damit andere den unsichtbaren Spieler sehen:
  #   true  = immer - auch durch Wände
  #   false = kein Umriss
  #   sight = nur, solange ihn ein anderer Spieler nicht von blöcken vertägt wird dann sehen den Umriss alle, auch durch Wände
  # Bei player_visibility_mode: false gibt es keinen Umriss.
  glowing-outline: true

  # Name über dem Spieler im Cam-Modus, an Stelle seines Namensschilds - so steht er auch über dem unsichtbaren Spieler,
  # und der Text ist frei wählbar: messages.player.name-format in der Sprachdatei, z. B. "Cam von {player}" (leer = gar kein Name).
  # Zu sehen für jeden, der den Spieler sieht (player_visibility_mode), auch für andere im Cam-Modus, nur nicht für ihn selbst.
  # false = sein normales Namensschild (unsichtbar sehen es nur andere im Cam-Modus)
  name-visible: true

  # Wie der Name am Spieler hängt:
  #   1 = wird jeden Tick über ihn gesetzt: immer zu sehen, kann beim schnellen Fliegen aber etwas hinterherhängen
  #   2 = sitzt fest auf ihm (als Passagier): hängt nie hinterher, wird beim Teleportieren aber kurz ausgeblendet.
  #       Andere Plugins können den Spieler dann nicht teleportieren (Spigot gar nicht, Paper nicht in eine andere Welt),
  #       Befehle wie /tp, Portale und CamFly selbst schon.
  name-mode: 1

  # Aussehen des Namens (der Text steht in der Sprachdatei unter messages.player.name-format, \n beginnt eine neue Zeile)
  name:
    # Farbe der Schrift (ersetzt einen Farbcode am Anfang von name-format):
    #   white, yellow, gold, red, dark_red, light_purple, dark_purple, blue,
    #   dark_blue, aqua, dark_aqua, green, dark_green, gray, dark_gray, black
    color: white
    # Durch Wände sichtbar (false = nur bei freier Sicht, der Name verrät nicht, wo der Spieler ist)
    through-walls: false
    # Sichtweite in Blöcken (64 = wie ein Namensschild; mehr als entity-tracking-range: display in der spigot.yml geht nicht)
    view-distance: 64
    # Dunkler Hintergrund wie bei einem Namensschild (false = keiner)
    background: true
    # Schatten unter der Schrift
    shadow: false
    # Größe (1 = wie ein Namensschild, 0.1 bis 10)
    scale: 1.0

  # Flug durch Lava (false = an der Lava geht es nicht weiter, bei border-mode: barrier wird sie zur Wand aus border-block-lava; in Lava startet der Cam-Modus nicht)
  allow_lava_flight: true

  # Flug durch Wasser (false = am Wasser geht es nicht weiter, bei border-mode: barrier wird es zur Wand aus border-block-water; im Wasser startet der Cam-Modus nicht)
  allow_water_flight: true

  # Flug durch Pulverschnee (false = am Pulverschnee geht es nicht weiter, bei border-mode: barrier wird er zur Wand aus border-block-powder-snow; darin startet der Cam-Modus nicht)
  allow_powder_snow_flight: true

  # Spielmodus im Cam-Modus:
  #   adventure = Abenteuermodus
  #   survival  = Überlebensmodus
  #   creative  = Kreativmodus
  #   keep      = der aktuelle Modus bleibt
  # Aus dem Zuschauermodus startet der Cam-Modus nie.
  gamemode: adventure

  # Ob Mobs den Spieler im Cam-Modus anschauen (false = sie schauen an ihm vorbei, als wäre er nicht da).
  # Wirkt nur auf Paper. Mobs, die ihr Gehirn steuert (Dorfbewohner, Piglins, Ziegen, Axolotl ...), schauen ihn weiter an,
  # unsichtbar aber nur aus höchstens 2 Blöcken (wie in Vanilla).
  mobs-look-at-player: false

  # Start mit Trankeffekten (sie pausieren im Cam-Modus):
  #   true     = mit allen
  #   false    = mit keinem
  #   positive = nur mit unschädlichen, z. B. Schnelligkeit, Leuchten
  start-with-effects: positive

# Körper, der im Cam-Modus an der Stelle des Spielers bleibt
body:
  # Art des Körpers:
  #   armorstand = Rüstungsständer mit dem Kopf des Spielers
  #   mannequin  = Mannequin mit dem Skin des Spielers
  type: armorstand

  # Name über dem Körper
  name-visible: true

  # Die Herzen des Spielers in einer eigenen Zeile am Namen über dem Körper zeigen, so viele, wie er hat: die Bilder
  # aus seiner Leiste, ganze und ein halbes, zehn pro Zeile. Ändern sie sich im Cam-Modus, etwa durch einen Heiltrank,
  # gehen sie mit. Bei name-visible: false stehen sie allein da.
  # Die Bilder gehen nur auf Paper. Auf Spigot stehen dort Zeichen, die in der Sprachdatei stehen
  # (messages.armorstand.health-full, -half und -empty).
  health-visible: false

  # Wo die Herzen stehen: above = über dem Namen, below = unter dem Namen
  health-position: above

  # Auch die Herzen zeigen, die ihm bis zu seinem Maximum fehlen, als leere Herzen - und wie in der Leiste jedes Herz
  # auf einem leeren, so dass ein halbes Herz auf der einen Seite rot und auf der anderen schwarz ist.
  health-show-missing: false

  # Die gelben Herzen eines Goldapfels (Absorption) hinter den roten zeigen, wie in der Leiste. Der Cam-Modus pausiert
  # den Effekt; gezeigt wird, was der Spieler beim Start hatte.
  health-show-absorption: true

  # Wohin die nächste Zeile Herzen kommt, wenn es mehr als zehn sind:
  #   true  = darüber, wie in der Leiste
  #   false = darunter
  health-rows-upward: true

  # Aussehen des Namens (der Text steht in der Sprachdatei unter messages.armorstand.name-format, \n beginnt eine neue Zeile)
  name:
    # Farbe der Schrift (ersetzt einen Farbcode am Anfang von name-format):
    #   white, yellow, gold, red, dark_red, light_purple, dark_purple, blue,
    #   dark_blue, aqua, dark_aqua, green, dark_green, gray, dark_gray, black
    color: yellow
    # Durch Wände sichtbar (false = nur bei freier Sicht, der Name verrät nicht, wo der Körper steht)
    through-walls: false
    # Sichtweite in Blöcken (64 = wie ein Namensschild; mehr als entity-tracking-range: display in der spigot.yml geht nicht)
    view-distance: 64
    # Dunkler Hintergrund wie bei einem Namensschild (false = keiner)
    background: true
    # Schatten unter der Schrift
    shadow: false
    # Größe (1 = wie ein Namensschild, 0.1 bis 10)
    scale: 1.0

  # Körper sichtbar (false = unsichtbar, der Name bleibt; armorstand und mannequin sind dann gleich)
  visible: true

  # Rüstung des Spielers am Körper zeigen (nur Optik, armorstand zeigt keinen Helm, dort sitzt der Kopf.)
  armor-visible: true

  # Wodurch sich der Körper verschieben lässt:
  #   0 = durch nichts, er steht fest
  #   1 = durch Schwerkraft, Wasser und Kolben
  #   2 = zusätzlich durch Spieler und Mobs   (nur bei type: mannequin oder visible: false, sonst gilt 1)
  movement-sensitivity: 1

  # Erlaubte Bewegung in Blöcken, bevor der Cam-Modus endet
  move-threshold: 0.05

  # Ob feindliche Mobs den Körper angreifen:
  #   vanilla = mit ihrer normalen Sichtweite (Zombie: 16 Blöcke)
  #   custom  = mit mob-target-radius, für alle gleich
  #   false   = nie
  # Der Wärter hält sich nur auf Paper daran, auf Spigot greift er den Körper an, wenn er ihn riecht.
  mob-target: false

  # Reichweite in Blöcken für mob-target: custom (0 = kein Mob, höchstens 64 wie der weiteste Mob in Vanilla)
  mob-target-radius: 16.0

  # Mobkopf als Helm halbiert die Reichweite dieser Mobart (wie in Vanilla )
  mob-target-heads: true

# Fluggeschwindigkeit im Cam-Modus (1 = normal, wie im Kreativmodus)
flight-speed:
  # Mit dem Mausrad ändern: hoch = schneller, runter = langsamer (wie im Zuschauermodus).
  # Geht in jedem Spielmodus, auch im Abenteuermodus. Der Platz in der Hotbar bleibt dabei, wie er war,
  # und die Action-Bar zeigt kurz die neue Geschwindigkeit (Text: flight-speed in der Sprachdatei).
  # Auch die Zifferntasten ändern sie dann um eine Stufe - der Server kann sie vom Mausrad nicht unterscheiden.
  mouse-wheel: true
  # Geschwindigkeit beim Start, zwischen min und max
  start: 1.0
  # Langsamste und schnellste Geschwindigkeit (0.1 bis 5; schneller lädt die Welt nicht mehr rechtzeitig nach,
  # und die Wand von border-mode: barrier kommt nicht hinterher)
  min: 0.5
  max: 3.0
  # Wie viel ein Dreh am Mausrad ändert
  step: 0.5

# Nachtsicht im Cam-Modus (nur der Spieler selbst sieht heller, ohne Partikel und ohne Symbol)
night-vision:
  # Wann:
  #   true  = immer
  #   false = nie
  #   dark  = nur, wenn es um die Kamera dunkel ist (siehe light-level), auch nachts unter freiem Himmel
  mode: dark
  # Bis zu welcher Helligkeit es als dunkel gilt, 0 bis 15 (Fackel direkt daneben: 14, Nacht unter freiem Himmel: 4).
  # Aus geht die Nachtsicht erst wieder, wenn es 2 Stufen heller ist, damit sie an der Grenze nicht flackert.
  light-level: 7

# Töne im Cam-Modus. Nur der Spieler selbst hört sie, sonst würden sie einen unsichtbaren Spieler verraten.
#   enabled = Ton an (true) oder aus (false)
#   sound   = der Name wie bei /playsound, z. B. block.beacon.activate, entity.player.levelup, block.note_block.pling
#             (ein Ton aus einem Ressourcenpaket mit seinem eigenen Namensraum, z. B. meinpaket:kamera.an)
#   volume  = Lautstärke, 0 bis 1 (0 = aus)
#   pitch   = Tonhöhe, 0.5 (tief) bis 2 (hoch), 1 = wie er ist
sounds:
  # Beim Start des Cam-Modus
  start:
    enabled: true
    sound: block.beacon.activate
    volume: 1.0
    pitch: 1.0
  # Beim Ende mit /cam (oder einem Klick auf den eigenen Körper), zurück am Körper
  end:
    enabled: true
    sound: block.beacon.deactivate
    volume: 1.0
    pitch: 1.0
  # Beim Ende, weil dem Körper etwas passiert ist: angegriffen, beschädigt, verschoben, ertrinkt, erstickt, Trank
  end-body:
    enabled: true
    sound: entity.illusioner.mirror_move
    volume: 1.0
    pitch: 1.0
  # Beim Ende von außen: /cam reload, /cam stop, /cam ban, Zeitlimit abgelaufen, Akku leer, afk-end, Teleport
  # (beim Tod, beim Verlassen des Servers und beim Herunterfahren gibt es keinen Ton)
  end-forced:
    enabled: true
    sound: block.respawn_anchor.deplete
    volume: 1.0
    pitch: 1.0
  # An der Grenze: max-distance, cam-area, gesperrte Lava, Wasser, Pulverschnee und gesperrte Portale.
  # So oft wie die Meldung dazu (distance-warning-cooldown usw.), auch wenn die Meldung selbst abgeschaltet ist.
  border:
    enabled: true
    sound: block.note_block.bass
    volume: 1.0
    pitch: 0.5
  # Beim Sprung zurück zum Körper mit /cam back (back-command)
  back:
    enabled: true
    sound: entity.enderman.teleport
    volume: 1.0
    pitch: 1.0
  # Kurz vor dem Ende durch Zeitlimit oder Akku (end-warning)
  end-warning:
    enabled: true
    sound: item.lodestone_compass.lock
    volume: 1.0
    pitch: 1.0
  # Wenn etwas dem Körper gefährlich wird (body-alarm)
  body-alarm:
    enabled: true
    sound: entity.warden.nearby_close
    volume: 1.0
    pitch: 1.0
  # Jede Sekunde der Wartezeit vor dem Start (start-delay)
  start-delay:
    enabled: true
    sound: block.note_block.hat
    volume: 1.0
    pitch: 1.0

# Schutz bei einem Absturz. Was der Cam-Modus dem Spieler abnimmt (Inventar, Spielmodus, Effekte, Flug), steht,
# solange der Cam-Modus läuft, auch in plugins/CamFly/playerdata/crash/<UUID>.yml. Beim Ende wird die Datei gelöscht.
# Stürzt der Server ab, ist sie beim nächsten Betreten noch da: Der Spieler bekommt alles zurück und steht wieder
# bei seinem Körper. Kostet eine kleine Datei beim Start und ein Löschen beim Ende, im Cam-Modus selbst nichts.
# Dateien, die schon da sind, werden auch mit false noch zurückgegeben.
crash-protection:
  enabled: true

# /cam list: wer gerade im Cam-Modus ist, wie lange schon und wie weit von seinem Körper
cam-list:
  # Wer den Befehl benutzen darf (die Konsole immer):
  #   admin = Operatoren und wer das Recht camplugin.list hat
  #   all   = jeder, der /cam benutzen darf
  #   false = kein Spieler
  access: admin
  # Hinter jedem Eintrag zwei Knöpfe: [Camera] teleportiert zur Kamera, [Body] neben den Körper
  # (Texte: cam-list-camera und cam-list-body in der Sprachdatei). Ein Klick schickt /cam tp <Name> camera|body.
  # Nur für Spieler, die die Liste sehen dürfen und das Recht camplugin.teleport haben (Operatoren haben es).
  # Wer selbst im Cam-Modus ist, beendet ihn dabei. Zur Kamera kommt nur, wer fliegen kann
  # (Kreativ- oder Zuschauermodus, oder /fly), sonst fiele er herunter. Der Cam-Modus des anderen läuft weiter.
  teleport: true
  # Dahinter ein dritter Knopf [Stop], der den Cam-Modus des Spielers beendet (Text: cam-list-stop).
  # Ein Klick schickt /cam stop <Name>. Nur bei stop-command.enabled: true und für Spieler, die die Liste
  # sehen dürfen und das Recht camplugin.stop haben (Operatoren haben es).
  stop: true

# Statistik: wie oft jemand im Cam-Modus war, wie lange insgesamt und am längsten,
# wie weit die Kamera geflogen ist und wie weit sie höchstens vom Körper weg war.
#   /cam stats                 = die eigene
#   /cam stats reset           = die eigene auf null setzen (der Akku bleibt, wie er ist)
#   /cam stats player <Name>   = die eines anderen (wer das darf, sagt view-others)
# Gezählt wird ein Cam-Modus, wenn er endet. Gespeichert wird in plugins/CamFly/playerdata/stats/<UUID>.yml,
# zusammen mit dem Ladestand des Akkus und der Wartezeit von time-limit (bei storage: file).
# /cam stats zeigt auch den Akku und eine Wartezeit, die noch läuft.
statistics:
  enabled: true
  # Wer die Statistik anderer mit /cam stats player <Name> sehen darf (die Konsole immer):
  #   admin = Operatoren und wer das Recht camplugin.stats.others hat
  #   all   = jeder, der /cam benutzen darf
  #   false = kein Spieler
  view-others: admin

# Protokoll: Jeder Start und jedes Ende des Cam-Modus kommt in eine Datei, eine pro Tag:
# plugins/CamFly/logs/<Datum>.log. Darin steht, wer, wann, wo der Körper stand, warum der Cam-Modus
# endete, wie lange er lief, wie weit die Kamera geflogen ist und wo sie zuletzt war -
# so lässt sich nachsehen, wer wo herumgeflogen ist.
cam-log:
  enabled: false
  # Dieselben Zeilen auch in die Konsole schreiben
  console: false
  # Wie viele Tage die Dateien bleiben, ältere werden gelöscht (0 = alle behalten)
  keep-days: 30

# Wie lange ein Cam-Modus laufen darf - mit Zeitlimit oder mit Akku, nur eins von beiden:
#   time-limit = jeder Flug dauert höchstens time-limit.duration-seconds
#   battery    = ein Akku, der sich im Flug leert und danach wieder lädt (Abschnitt battery)
#   false      = so lange er will
# Kurz vor dem Ende warnt end-warning.
flight-limit: false

# Zeitlimit für den Cam-Modus (bei flight-limit: time-limit)
time-limit:
  # Wartezeit nach dem Beenden (geht bei jedem flight-limit, auch bei false; ein Ende durch /cam reload zählt nicht)
  cooldowns-enabled: false
  # Maximale Dauer in Sekunden
  duration-seconds: 300
  # Wartezeit bis zum nächsten Start in Sekunden
  cooldown-seconds: 120
  # Restzeit als Bossbar anzeigen
  show-bossbar: true
  # Die Wartezeit als Bossbar anzeigen, bis man wieder in den Cam-Modus darf - auch nach dem Betreten des Servers
  # (Text: cooldown-bossbar in der Sprachdatei)
  show-bossbar-cooldown: true
  # BLUE, GREEN, PINK, PURPLE, RED, WHITE oder YELLOW (für beide Bossbars)
  bossbar-color: BLUE
  # Einteilung der Bossbars in Abschnitte: 0 = keine, 6, 10, 12 oder 20
  bossbar-notches: 0
  # Wo die Wartezeiten liegen:
  #   file   = in plugins/CamFly/playerdata/stats/<UUID>.yml - sie laufen nach /cam reload und einem Neustart weiter
  #   memory = nur im Arbeitsspeicher - nach /cam reload oder einem Neustart sind alle vorbei
  storage: file

# Akku (bei flight-limit: battery): Im Cam-Modus läuft er leer, außerhalb lädt er sich wieder auf.
# Ist er leer, endet der Cam-Modus. Zu sehen ist der Ladestand mit /cam stats.
battery:
  # Ein voller Akku, in Sekunden Flug
  capacity: 300
  # Wie viele Sekunden Flug pro Sekunde außerhalb des Cam-Modus zurückkommen
  # (0.5 = ein leerer Akku mit 300 Sekunden ist nach 10 Minuten wieder voll; mindestens 0.01)
  recharge-per-second: 0.5
  # So viele Sekunden Flug braucht ein Start mindestens (höchstens capacity)
  min-start: 10
  # Auch laden, während der Spieler nicht auf dem Server ist (false = nur, solange er online ist)
  recharge-offline: true
  # Ladestand als Bossbar im Cam-Modus anzeigen (Text: battery-bossbar in der Sprachdatei)
  show-bossbar: true
  # Die Bossbar nach dem Ende weiter zeigen, solange der Akku lädt, bis er wieder voll ist
  # (auch nach dem Betreten des Servers; Text: battery-bossbar-charging)
  show-bossbar-charging: true
  # BLUE, GREEN, PINK, PURPLE, RED, WHITE oder YELLOW (für beide Bossbars)
  bossbar-color: GREEN
  # Einteilung der Bossbars in Abschnitte: 0 = keine, 6, 10, 12 oder 20
  bossbar-notches: 10
  # Wo der Ladestand liegt:
  #   file   = in plugins/CamFly/playerdata/stats/<UUID>.yml - er bleibt nach /cam reload und einem Neustart
  #   memory = nur im Arbeitsspeicher - nach /cam reload oder einem Neustart sind alle Akkus wieder voll
  storage: file

# Was ein Start des Cam-Modus kostet. Bezahlt wird erst, wenn sonst nichts mehr gegen den Start spricht.
# Fehlt etwas, wird gar nichts genommen und der Spieler erfährt, was ihm fehlt.
start-cost:
  enabled: false
  # Erfahrung pro Start (0 = keine)
  xp: 0
  # Worin xp zählt:
  #   levels = ganze Level
  #   points = Erfahrungspunkte (wie bei /xp add <Spieler> <Zahl> points)
  xp-type: levels
  # Geld pro Start (0 = keins). Braucht Vault und ein Economy-Plugin, sonst kostet der Start kein Geld
  # (das steht dann einmal in der Konsole).
  money: 0.0
  # Items pro Start, je eine Zeile Name: Anzahl, z. B.
  #   items:
  #     ender_eye: 1
  #     paper: 2
  # Gezählt wird, was der Spieler in Hotbar, Inventar und Zweithand trägt, nicht die Rüstung. {} = keine Items
  items: {}

# Partikel um den Spieler im Cam-Modus (er selbst sieht sie nicht, nur andere)
camera-particles:
  # Partikel an (true) oder aus (false)
  enabled: true
  # Welche Partikel, z. B. soul_fire_flame, flame, end_rod oder heart
  # (nur Partikel ohne Zusatzangaben, also keine dust- oder Block-Partikel)
  particle: soul_fire_flame
  # Höhe über den Füßen in Blöcken
  height: 0.2
  # Partikel pro Tick, Kommazahl mit Punkt: 0.5 = jeden zweiten Tick eins (0 = aus, höchstens 100)
  particles-per-tick: 1
  # Wie weit die Partikel um den Punkt streuen, in Blöcken (0 = alle auf einem Punkt)
  spread: 0.0

# Feuerschutz im Cam-Modus: Der Spieler brennt nicht
fireguard:
  enabled: true
  # Feuer in der Nähe für den Spieler ausblenden
  hide-fire: true
  # Prüfintervall in Ticks
  tick-interval: 10
  # Suchradius für hide-fire in Blöcken (höchstens 8, jeder Block im Umkreis wird bei jeder Prüfung angesehen)
  radius-horizontal: 1.5
  radius-up: 2
  radius-down: 1

# Kamera-Kopf auf dem Spieler im Cam-Modus (auch bei unsichtbarem Spieler zu sehen)
camera-head:
  enabled: false

# Den Cam-Modus mit der Taste zum Tauschen der Hände beenden (voreingestellt F), wie mit /cam.
# Geht mit leeren Händen. Hat ein Spieler die Taste anders belegt, gilt seine - und der Hinweis
# in der Action-Bar nennt auch seine.
exit-key:
  enabled: true

# /cam back: Die Kamera springt zurück zum Körper, der Cam-Modus läuft weiter - für jeden, der sich verflogen hat.
# Sie schaut danach in dieselbe Richtung wie vorher. Aus einer anderen Welt (Portal) geht es genauso zurück.
# Ton: sounds.back, Text: back-to-body in der Sprachdatei.
back-command:
  enabled: true

# /cam stop <Name> beendet den Cam-Modus eines anderen Spielers, /cam stop all den von allen - z. B. vor einem
# Event oder einem Neustart. Er kommt zurück zu seinem Körper und erfährt, wer es war (Text: stopped-by).
# Benutzen dürfen es die Konsole und wer das Recht camplugin.stop hat (Operatoren haben es). Ton: sounds.end-forced.
stop-command:
  enabled: false

# /cam ban sperrt Spieler aus dem Cam-Modus aus, einzelne oder alle:
#   /cam ban <Name> [Zeit] [Grund]  = einen Spieler, z. B. /cam ban Steve 2h Griefing (ohne Zeit für immer)
#   /cam ban all [Zeit] [Grund]     = alle, z. B. während eines Events - außer wer das Recht camplugin.ban.bypass hat
#                                     (Operatoren haben es)
#   /cam unban <Name>               = die Sperre eines Spielers aufheben
#   /cam unban all                  = die Sperre für alle aufheben (die einzelnen bleiben)
#   /cam banlist                    = wer gesperrt ist, wie lange noch, von wem und warum
# Zeit: Zahlen mit s, m, h, d oder w dahinter, auch zusammen, z. B. 30m, 2h, 1d12h oder 1w.
# Wer gerade im Cam-Modus ist, kommt zurück zu seinem Körper (Ton: sounds.end-forced) und erfährt, wer es war.
# Die Sperre eines einzelnen Spielers gilt auch für Operatoren. Gespeichert wird in plugins/CamFly/bans.yml,
# die Sperren bleiben nach /cam reload und einem Neustart.
# Benutzen dürfen es die Konsole und wer das Recht camplugin.ban hat (Operatoren haben es).
cam-ban:
  # false = die Befehle sind aus, und keine Sperre gilt (bans.yml bleibt, wie sie ist)
  enabled: false

# /cam trail zeigt, wo die Kamera eines Spielers herumgeflogen ist: als Linie aus Partikeln, die nur
# der sieht, der fragt - von grün am Körper über gelb nach rot, wo die Kamera zuletzt war. Dazu stehen im
# Chat Länge, Dauer, Start und Ende des Flugs (Texte: trail-...), auch für die Konsole, die keine Partikel sieht.
#   /cam trail <Name>           = sein letzter Flug. Ist er noch im Cam-Modus, sein Flug bis jetzt, und die
#                                 Linie wächst mit.
#   /cam trail <Name> <Nummer>  = einer der gemerkten Flüge (flights): 1 = der letzte, 2 = der davor ...
#                                 Im Chat stehen dafür Knöpfe zum Anklicken (Texte: trail-button ...).
#   /cam trail <Name> all       = alle gemerkten Flüge auf einmal
#   /cam trail                  = die Linie wieder ausblenden
# Wo die Kamera versetzt wurde (/cam back, Portal, Teleport), hat die Linie eine Lücke.
# Gezeichnet wird bis 128 Blöcke um den, der zusieht.
# Aufgezeichnet wird nur, solange enabled an ist, und nur im Arbeitsspeicher, bis zum Neustart
# (nach /cam reload bleiben die Flüge, mit enabled: false sind sie weg).
# Benutzen dürfen es die Konsole und wer das Recht camplugin.trail hat (Operatoren haben es).
cam-trail:
  enabled: false
  # Wie viele seiner letzten Flüge von jedem Spieler gemerkt werden (1 bis 20)
  flights: 5
  # Wie lange die Linie zu sehen ist, in Sekunden (1 bis 600)
  show-seconds: 30

# Der Cam-Modus endet, wenn der Spieler eine Weile gar nichts tut: nicht fliegt, sich nicht umsieht und nicht
# am Mausrad dreht. So steht kein Körper stundenlang herum, und der Akku läuft nicht leer, während niemand fliegt.
# Beim Ende kommt afk-ended und der Ton sounds.end-forced.
afk-end:
  enabled: false
  # Nach wie vielen Sekunden ohne etwas zu tun (mindestens 10)
  seconds: 300
  # Wann gewarnt wird: wenn so viel Prozent von seconds ohne etwas zu tun vergangen sind, 0 bis 99 (0 = keine Warnung).
  # Bei seconds: 300 und 80 also nach 240 Sekunden, eine Minute vor dem Ende. Gewarnt wird einmal, mit dem Ton
  # sounds.end-warning und einer Zeile in der Action-Bar (Text: end-warning-afk); tut er danach etwas, beginnt es von vorn.
  warning-percent: 80

# Warnung kurz vor dem Ende durch flight-limit (Zeitlimit oder Akku): ein Ton (sounds.end-warning)
# und eine Zeile in der Action-Bar (Texte: end-warning-time-limit, end-warning-battery).
# Wann afk-end warnt, steht dort unter warning-percent.
end-warning:
  enabled: true
  # Bei wie vielen Sekunden Rest gewarnt wird, z. B. [60, 30, 10] ([] = nie)
  # Nur, wenn die Zeit dort hinunter läuft: Wer mit 20 Sekunden Akku startet, bekommt die 30 nicht mehr.
  seconds: [30, 10]

# Alarm, wenn etwas dem Körper gefährlich wird: ein Ton (sounds.body-alarm) und eine Zeile in der Action-Bar
# (Texte: body-alarm-mob, body-alarm-player). Jeder Mob und jeder Spieler löst ihn nur einmal aus, solange er bleibt.
body-alarm:
  # Mobs, die hinter dem Körper her sind. Das gibt es nur bei body.mob-target: vanilla oder custom,
  # bei false greift kein Mob den Körper an, und es kommt kein Alarm.
  mobs: true
  # Andere Spieler, die dem Körper näher kommen als player-radius
  # (nicht die im Cam-Modus, keine Zuschauer und keine, die der Spieler nicht sehen kann, z. B. durch Vanish)
  players: false
  # Wie nah ein Spieler kommen muss, in Blöcken (höchstens 64)
  player-radius: 10.0
  # Sekunden zwischen zwei Alarmen
  cooldown: 5

# Wartezeit vor dem Start: Nach /cam beginnt der Cam-Modus erst nach seconds, wie ein Teleport mit Wartezeit
# auf vielen Servern. So lange muss der Spieler stehen bleiben (umsehen darf er sich) und darf keinen Schaden
# nehmen - so flüchtet niemand mitten aus einem Kampf in den Cam-Modus.
# Die Action-Bar zählt die Sekunden herunter (Text: start-delay-countdown), jede mit dem Ton sounds.start-delay.
# Abgebrochen wird der Start, wenn er sich bewegt (start-delay-moved), Schaden nimmt (start-delay-damaged) oder
# /cam noch einmal eingibt (start-delay-cancelled). Wer im Wasser treibt oder fällt, bewegt sich auch.
# Ob er starten darf (cam-ban, Wartezeit, Akku, cam-area, cam-safety ...), wird vorher und am Ende noch einmal
# geprüft. start-cost wird vorher nur nachgesehen und erst bezahlt, wenn der Cam-Modus wirklich beginnt.
start-delay:
  enabled: false
  # Wie lange, in Sekunden (1 bis 60)
  seconds: 3

# Kein Cam-Modus direkt nach erlittenem Schaden
cam-safety:
  enabled: true
  # Wartezeit nach dem letzten Schaden in Sekunden
  delay: 5
  # Auch nach ausgeteiltem Schaden warten, damit niemand mitten im Kampf in den Cam-Modus flüchtet.
  # Pfeile, Dreizacke und andere Geschosse des Spielers zählen mit; Rüstungsständer und Mannequins zählen nie.
  after-attack:
    # Nach einem Treffer auf einen anderen Spieler (auch auf seinen Körper im Cam-Modus)
    players: false
    # Nach einem Treffer auf einen feindlichen Mob, z. B. Zombie, Skelett, Creeper, Piglin
    mobs: false
    # Nach einem Treffer auf etwas Friedliches: Tiere, Dorfbewohner, Golems und NPCs anderer Plugins (z. B. Citizens)
    friendly: false

# Wo der Cam-Modus erlaubt ist
cam-area:
  # Wie streng:
  #   0 = aus, die Listen werden nicht geprüft
  #   1 = nur beim Start
  #   2 = beim Start und im Flug - an der Grenze geht es nicht weiter (wie, sagt camera-mode.border-mode)
  level: 2

  # Sekunden zwischen zwei Meldungen an der Grenze (nur Stufe 2)
  warning-cooldown: 3

  # Biom-Liste beachten
  biomes-enabled: true

  # Verbotene Biome ([] = keine; Jede Struktur nur in eine Liste, sonst wird sie ignoriert)
  forbidden-biomes:
    - lush_caves
    - dripstone_caves
    - deep_dark
    - sulfur_caves

  # Struktur-Listen beachten
  structures-enabled: false

  # Verbotene Strukturen, in zwei Listen (Jede Struktur nur in eine Liste, sonst wird sie ignoriert):
  #   -box        = der ganze Bereich der Struktur, lückenlos   (für kompakte Bauten)
  #   -components = nur die einzelnen Bauteile, dazwischen frei  (für weitläufige Bauten wie die Netherfestung)
  forbidden-structures-box:
    - monument
    - swamp_hut
    - pillager_outpost
  forbidden-structures-components:
    - mansion
    - fortress
    - ancient_city
    - trial_chambers
    - bastion_remnant
    - end_city

  # Zwischenspeicher der Struktur-Prüfung in Chunks (256 = etwa 50 KB RAM, höchstens 4096; 0 = aus, kostet dann mehr Rechenzeit)
  # Neu platzierte Strukturen zählen erst nach /cam reload (bei 0 sofort).
  structures-cache-chunks: 256

  # Dimensionen, in denen der Cam-Modus erlaubt ist (Eigene Dimensionen von Plugins oder Datenpacks sperrt diese Liste nie.)
  dimensions:
    overworld: true
    nether: false
    end: false

  # Welten-Liste beachten
  worlds-enabled: false

  # Verbotene Welten nach ihrem Namen - für eigene Welten wie eine Lobby oder eine Eventwelt, die dimensions
  # nicht auseinanderhält. Der Name wie der Ordner der Welt, z. B. [lobby, event, world_nether] ([] = keine)
  forbidden-worlds: [lobby]

# Portale im Cam-Modus (In der anderen Welt zählt max-distance ab dem Portal, wenn cam-area level:2 dann kann man zurück geschikt werden wenn Umgebung gespert ist)
portals:
  # Netherportal durchlassen (in beide Richtungen)
  nether: false

  # Endportal durchlassen (in beide Richtungen, End Gateway zählt nicht)
  end: false

  # Wohin ein Spieler zurückgebracht wird, der drüben zu weit weg oder in einem verbotenen Gebiet landet:
  #   body   = zu seinem Körper
  #   portal = zum Portal, durch das er ging (wenn möglich, sonst body)
  return-to: body

  # Sekunden zwischen zwei Meldungen an einem gesperrten Portal
  warning-cooldown: 3

  # Portale merken, die in ein verbotenes Biom oder eine verbotene Struktur führen (cam-area Stufe 2, Gemerkt wird bis zum Neustart oder /cam reload.):
  #   true  = nach dem ersten Zurückholen bleibt das Portal gesperrt
  #   false = jedes Mal hin und gleich wieder zurück
  remember-blocked: true

  # Wie viele Portale höchstens gemerkt werden (0 = keine)
  remember-blocked-count: 128

  # Gemerktes Portal wieder freigeben, wenn sich drüben etwas ändert (false = erst /cam reload gibt es frei):
  #   - das Portal dort ist abgebaut oder versetzt
  #   - die Stelle ist nicht mehr verboten
  #   - ein neues Portal steht in der Nähe (siehe forget-radius)
  forget-changed: true

  # Umkreis in Blöcken (waagerecht) um die Ankunftsstelle:
  # 0 = aus. Sollte zu portal-search-radius des Servers passen.
  forget-radius: 128

# Teleports im Cam-Modus, z. B. /tpa, /tpahere, /tp, /home, /spawn:
#   true  = der Cam-Modus endet. Wer im Cam-Modus teleportiert wird, kommt mit seinen Sachen am Ziel an.
#           Landet ein anderer genau bei einer Kamera (z. B. /tpahere aus dem Cam-Modus), endet deren
#           Cam-Modus, und er kommt bei ihrem Körper an statt in der Luft.
#   false = der Spieler bleibt im Cam-Modus, nur die Kamera steht dann am Ziel
teleports:
  # Teleports durch Befehle wie /tp und /teleport (manche Plugins melden ihre auch so, z. B. EssentialsX)
  command: true

  # Teleports durch andere Plugins, z. B. /tpa, /tpahere, /home, /spawn, /warp
  plugin: true

# Treffer auf den Körper an den Spieler weitergeben
mirror-damage:
  # Schaden für den Spieler:
  #   mirror = wie der echte Treffer
  #   custom = fester Wert (custom-damage-hearts)
  #   false  = kein Schaden
  damage-mode: mirror

  # Schaden in Herzen für custom, plus Bonus durch Schärfe/Stärke (0 = gar kein Schaden)
  custom-damage-hearts: 0.5

  # Ob Rüstung, Schutz-Verzauberungen und Effekte den Schaden mindern:
  #   true  = ja, wie bei einem echten Treffer
  #   false = nein, voller Schaden wie ohne Rüstung
  damage-counts-armor: true

  # Abnutzung der Rüstung des Spielers:
  #   mirror = wie beim echten Treffer
  #   custom = feste Punkte (custom-armor-damage)
  #   false  = keine Abnutzung
  damage-armor-mode: mirror

  # Haltbarkeitspunkte pro Treffer für custom (0 = keine)
  custom-armor-damage: 1

  # Unbreaking (Haltbarkeit) senkt die Abnutzung wie in Vanilla
  respect-unbreaking: true

  # Rückstoß für den Spieler, unabhängig vom Schaden
  knockback: true
