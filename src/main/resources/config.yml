# Texte, die das Plugin im Spiel ausgibt
messages:
  actionbar-off: "&cCam mode ended"
  actionbar-on: "&aCam mode activated"
  armorstand.name-format: "&e{player}'s Body"
  body-attacked: "&cYour body was attacked by {damager}! Camera mode ended."
  body-drowning: "&cYour body is drowning! Camera mode ended."
  body-env-damage: "&cYour body was damaged by {cause}! Camera mode ended."
  body-got-effect: "&cYour body was hit by an effect and camera mode was ended!"
  body-missing: "&cYour body no longer exists! Camera mode ended."
  body-moved: "&cYour body was moved! Camera mode ended."
  body-suffocating: "&cYour body is stuck and suffocating! Camera mode ended."
  bossbar-text: "Cam mode ends in: %time%"
  cam-safety: "§cYou cannot start cam mode! You must remain safe for %seconds% more seconds."
  camera-off: "&aCamera mode ended."
  camera-on: "&aCamera mode activated! Use /cam again to exit."
  cant-attack-other-body: "&cYou cannot attack other bodies in camera mode."
  cant-fly-in-lava: "&cYou cannot fly through lava! Camera mode will be ended."
  cant-interact-other: "&cYou cannot interact with another player's body!"
  # Meldungen über fehlerhafte Werte in dieser Datei. Sie gehen immer ins
  # Server-Log und bei /cam reload zusätzlich an den Spieler, der ihn
  # ausgelöst hat. Platzhalter: {path} der Schlüssel, {value} der eingetragene
  # Wert, {used} der stattdessen benutzte Wert, {allowed} die erlaubten Werte,
  # {min} der Mindestwert, {count} die Anzahl der Meldungen.
  # Leer lassen bringt nichts, dann greift der eingebaute Text - zum
  # Abschalten message-settings.config-errors auf false setzen.
  config-error-header: "&cDie Konfiguration hat {count} ungültige Stellen:"
  config-error-header-single: "&cDie Konfiguration hat eine ungültige Stelle:"
  config-error-more: "&c... und {count} weitere. Alle stehen in der Server-Konsole."
  config-expected-boolean: "&cFalscher Wert für {path}: '{value}'. Erwartet wird true oder false. Es wird {used} verwendet."
  config-expected-number: "&cFalscher Wert für {path}: '{value}'. Erwartet wird eine Zahl. Es wird {used} verwendet."
  config-expected-text: "&cFalscher Wert für {path}: '{value}'. Erwartet wird Text. Es wird {used} verwendet."
  config-too-small: "&cWert für {path} ist zu klein: {value}. Es wird {min} verwendet."
  config-unknown-value: "&cUnbekannter Wert für {path}: '{value}'. Erlaubt sind: {allowed}. Es wird {used} verwendet."
  cooldown-available: "&aCam mode available again"
  cooldown-text: "You can start cam mode again in %time%."
  distance-limit: "&cYou cannot move further than {distance} blocks from your body!"
  hitbox.name-format: "&c[HITBOX] {player}"
  no-permission: "&cYou don't have permission to use this command."
  no-player: "&cThis command can only be used by players."
  no-projectiles: "&cYou cannot shoot projectiles in camera mode."
  reload-exit: "&cCamera mode ended due to plugin restart."
  reload-start: "&ePlugin is restarting..."
  reload-success: "&aPlugin reload successful."
  # Zeilen in der Server-Konsole beim Start. Das Plugin lädt dabei einmal die
  # Skins vor, dazwischen schreibt der Server selbst seine Zeile
  # "Environment: ...". Leer lassen ("") schaltet die jeweilige Zeile ab.
  # Platzhalter bei startup-skins-failed: {error} der Grund des Fehlers.
  startup-skins-failed: "Skins konnten beim Start nicht vorgeladen werden: {error}"
  startup-skins-loaded: "Skins wurden erfolgreich geladen."
  startup-skins-loading: "Skins werden geladen..."
  time-limit-expired: "&cCam mode ended: Time limit expired."

# Aktiviert oder deaktiviert einzelne Nachrichten
message-settings:
  body-attacked: true
  body-drowning: true
  body-env-damage: true
  body-got-effect: true
  body-missing: true
  body-moved: true
  body-suffocating: true
  bossbar-text: true
  cam-safety: true
  camera-off: false
  camera-on: false
  cant-attack-other-body: true
  cant-fly-in-lava: true
  cant-interact-other: true
  # Gilt für den ganzen config-*-Block und nur für den Chat beim Reload,
  # ins Server-Log gehen die Meldungen immer
  config-errors: true
  cooldown-available: true
  cooldown-text: true
  distance-limit: true
  enabled: true
  no-permission: true
  no-player: true
  no-projectiles: true
  reload-exit: true
  reload-start: true
  reload-success: true
  time-limit-expired: true

# Einstellungen für die Action-Bar Anzeige
action-bar:
  # Legt fest, ob die Action-Bar verwendet wird
  enabled: true
  # Dauer der Ausblendung nach dem Beenden
  off-duration: 1


# Grundeinstellungen des Kamera-Modus
camera-mode:
  # Aktiviert die Begrenzung der Entfernung zum Körper
  max-distance-enabled: true
  # Maximale Entfernung in Blöcken
  max-distance: 100.0
  # Abklingzeit zwischen Distanzwarnungen
  distance-warning-cooldown: 3
  # Wer den Spieler im Cam-Modus sehen darf
  # cam   = nur Spieler, die selbst im Cam-Modus sind
  # true  = alle
  # false = niemand. Das läuft allein über den Unsichtbarkeitseffekt, damit
  #         der Spieler in der Tab-Liste stehen bleibt. Der Effekt wird in
  #         diesem Modus immer gesetzt, auch wenn allow_invisibility_potion
  #         auf false steht, und der leuchtende Umriss bleibt aus.
  #         Getragene Ausrüstung, etwa der Kamera-Kopf, bleibt sichtbar.
  player_visibility_mode: "true"
  # Macht den Spieler im Cam-Modus unsichtbar
  allow_invisibility_potion: true
  # Umrandet den unsichtbaren Spieler mit einem leuchtenden Umriss, damit
  # andere ihn als Geist sehen statt gar nicht. Ohne ihn ist er für alle
  # unsichtbar, die ihn laut player_visibility_mode sehen dürften.
  # true  = leuchtet immer. Achtung: Ein Leuchten ist auch durch Wände
  #         sichtbar - auf einem PvP-Server verrät es die Position des
  #         Spielers.
  # false = kein Umriss
  # sight = leuchtet nur, solange mindestens ein anderer Spieler direkte
  #         Sicht auf ihn hat (von Augen zu Augen, ohne Block dazwischen).
  #         Das Leuchten gilt für alle zugleich: Sieht ihn einer, sehen den
  #         Umriss auch Spieler hinter einer Wand. Sieht ihn niemand, verrät
  #         der Umriss nichts. Spieler im Zuschauermodus zählen nicht mit,
  #         bei player_visibility_mode "cam" nur Spieler im Cam-Modus.
  # Leuchtete der Spieler schon vor dem Cam-Modus, bleibt das Leuchten an.
  # Getragene Ausrüstung, etwa der Kamera-Kopf, bleibt davon unberührt
  # sichtbar.
  # Bei player_visibility_mode "false" wird der Umriss nicht gesetzt.
  glowing-outline: true
  # Erlaubt Flug durch Lava
  allow_lava_flight: true

# Körper, der im Kamera-Modus an der Stelle des Spielers zurückbleibt
# In beiden Fällen nimmt ein Mannequin den Schaden: Es hat die Hitbox eines
# Spielers und trägt die Rüstung, deshalb rechnet der Server den Schaden bei
# beiden Typen gleich aus. Jeder Treffer beendet den Kamera-Modus.
# Am Mannequin wird bei beiden Typen auch die Bewegung gemessen: Verlässt es
# seinen Platz, endet der Kamera-Modus mit der Nachricht "body-moved".
# Was den Körper überhaupt bewegen darf und wie weit er dabei kommt, legen
# movement-sensitivity und move-threshold fest.
body:
  # Welche Entität als Körper benutzt wird
  # 1 = Rüstungsständer mit dem Kopf des Spielers, dazu ein unsichtbares
  #     Mannequin an derselben Stelle, das die Treffer abbekommt.
  #     Auch seine Rüstung wird nicht angezeigt (kein Resourcepack nötig).
  # 2 = sichtbares Mannequin mit dem Skin des Spielers, das die Rüstung
  #     des Spielers auch sichtbar trägt
  # Bei einem unbekannten Wert wird 1 verwendet.
  type: 1
  # Zeigt den Namen über dem Körper an. Gilt für beide Typen.
  # Der Text dazu steht unter messages.armorstand.name-format.
  name-visible: true
  # Ob der Körper zu sehen ist. Auf false sind beide Typen gleich: Der
  # Rüstungsständer wird unsichtbar und bekommt den Kopf des Spielers gar
  # nicht erst aufgesetzt, sonst schwebte er allein weiter in der Luft, und
  # daneben steht wie bei Typ 1 das unsichtbare Mannequin, das die Treffer
  # nimmt. Auch bei Typ 2 wird also kein Mannequin mehr angezeigt - eines,
  # das nicht gezeichnet wird, würde nämlich auch seinen Namen nicht mehr
  # anzeigen, und der soll stehen bleiben.
  # Der Name über dem Körper bleibt in beiden Fällen stehen, den schaltet
  # name-visible ab.
  visible: true
  # Wie empfindlich der Körper auf Verschiebung reagiert
  # 0 = reagiert auf gar nichts. Körper und Mannequin stehen fest, weder
  #     Schwerkraft noch Wasser noch Kolben bewegen sie. Damit ist die
  #     Bewegungserkennung aus, "body-moved" kommt nie.
  # 1 = normal. Schwerkraft, Wasser und Kolben bewegen den Körper und jede
  #     Bewegung beendet den Kamera-Modus. Spieler und Mobs können ihn
  #     nicht anrempeln.
  # 2 = sehr empfindlich. Zusätzlich schieben Spieler und Mobs den Körper
  #     weg, was den Kamera-Modus ebenfalls beendet.
  #     Nur für type: 2 verfügbar! Bei type: 1 würde nur das unsichtbare
  #     Mannequin geschoben, während der sichtbare Rüstungsständer stehen
  #     bleibt - dort wird deshalb automatisch Stufe 1 benutzt.
  # Bei einem unbekannten Wert wird 1 verwendet.
  movement-sensitivity: 1
  # Wie weit sich das Mannequin bewegen darf, bevor der Kamera-Modus endet,
  # in Blöcken. Gilt bei beiden Körpertypen und ist auf Stufe 0 wirkungslos.
  # Werte unter 0.01 werden automatisch auf 0.01 angehoben.
  move-threshold: 0.05

# Begrenzung der Dauer des Kamera-Modus
time-limit:
  # Aktiviert das Zeitlimit
  enabled: false
  # Aktiviert eine Abklingzeit nach Ablauf
  cooldowns-enabled: false
  # Maximale Dauer des Modus in Sekunden
  duration-seconds: 300
  # Wartezeit bis zum nächsten Start in Sekunden
  cooldown-seconds: 120
  # Zeigt eine Bossbar zur Anzeige der verbleibenden Zeit
  show-bossbar: true
  # Farbe der Bossbar
  bossbar-color: BLUE

# Partikel um den Spieler im Kamera-Modus
camera-particles:
  # Vertikale Position der Partikel
  height: 0.2
  # Anzahl der Partikel pro Tick
  particles-per-tick: 0.1
  # Zeigt Partikel auch dem Spieler selbst an
  show-own-particles: false

# Schutz vor Feuer während des Kamera-Modus
fireguard:
  # Aktiviert den Feuerschutz
  enabled: true
  # Blendete nahe Feuer optisch aus
  hide-fire: true
  # Abstand der Aktualisierung in Ticks
  tick-interval: 10
  # Horizontaler Suchradius
  radius-horizontal: 1.5
  # Vertikaler Radius nach oben
  radius-up: 2
  # Vertikaler Radius nach unten
  radius-down: 1

# Setzt dem Spieler einen Kamera-Kopf auf
# Funktioniert weiterhin: Der Kopf ist getragene Ausrüstung und bleibt auch
# an einem unsichtbaren Spieler sichtbar - er schwebt dann dort, wo der
# Spieler ist
camera-head:
  # Aktiviert den Kamerakopf
  enabled: false

# Schutz vor sofortigem Start nach Schaden
cam-safety:
  # Aktiviert die Sicherheitsprüfung
  enabled: true
  # Wartezeit nach letztem Schaden in Sekunden
  delay: 5

# Einstellungen zur Übertragung von Schaden
mirror-damage:
  # Die Rüstung des Spielers verliert beim übertragenen Treffer Haltbarkeit.
  # Geschützt wird der Spieler in jedem Fall: der Schaden wird immer genau
  # einmal an ihm berechnet, mit seiner Rüstung und seinen Effekten.
  damage-armor: true
  # Art der Schadensübertragung: mirror | custom | off
  damage-mode: mirror  # mirror | custom | off
  # Stößt der übertragene Treffer den Spieler zurück? Mit false kommt der
  # Schaden an, der Stoß dahinter nicht.
  knockback: true
  # Fester Schaden in Herzen für den Modus "custom". 0 bedeutet kein Schaden,
  # dann zählen auch Verzauberungen der Waffe nicht mehr dazu.
  custom-damage-hearts: 0.5
  # Schreibt zu jedem übertragenen Treffer eine Zeile mit allen Werten in den
  # Chat des Spielers und ins Log. Nur zum Nachmessen gedacht.
  debug: false