  cam-list-body: "&a[Body]"
  cam-list-body-hover: "&7Teleport to {player}'s body"
  cam-list-camera: "&b[Camera]"
  cam-list-camera-hover: "&7Teleport to {player}'s camera"
  cam-list-empty: "&eNobody is in cam mode."
  cam-list-entry: "&7- &f{player}&7: {time}, {distance} blocks from the body"
  cam-list-entry-away: "&7- &f{player}&7: {time}, in another world"
