  # /cam follow (follow; the keys keep the name it had before, tour): {player} is the other one - the leader, a follower
  # or whom he invites -, {blocks} by how much he stands further than follow.start-distance from the leader out of cam
  # mode (tour-start-too-far; tour-too-far-guest is the same in cam mode, further than follow.radius), {players} the
  # followers the leader leaves behind and {time} the time left before it ends for them: tour-reach-warning (for the
  # follower) and tour-reach-warning-guide (for the leader) count it down in the action bar, tour-reach-lost and
  # tour-reach-lost-guide say when it is over. tour-invitation has the buttons tour-button-accept and
  # tour-button-decline behind it, and what hovering over them says; it and tour-invited say for how many seconds it
  # holds (follow.invitation-seconds). tour-invite-wait: he invited that player too short a time ago
  # (follow.invite-cooldown-seconds, the seconds left; once that player accepted, there is no wait). In these and in
  # tour-invited-all {time} is that many seconds with the word, "1 second" or "60 seconds", and {seconds} the number
  # alone. /cam follow invite all (follow.invite-all): tour-invited-all
  # says whom ({players}) and how many ({count}) it invited, tour-invite-all-none that there was nobody to invite -
  # those invited already, invited a moment ago or kept from following are left out -, and how close they have to
  # be ({start} follow.start-distance, {radius} follow.radius; tour-invite-all-none-cam-only while start-distance is
  # 0), tour-invite-all-off that it is switched off. tour-view-guide and tour-view-free answer
  # /cam follow view, tour-view-unavailable says that the leader's view does not work on the server
  # (follow.guide-view). tour-guide-spectator: a player out of cam mode (follow.lead-without-cam) can't lead in
  # spectator mode; tour-guide-cannot-lead: the leader can't lead any more when he is accepted (tour-guide-gone while
  # only who is in cam mode may lead). tour-full and tour-full-guide: the leader has follow.max-guests ({max})
  # followers already. tour-body-locked: a follower clicked or hit his own body, which he cannot use while he follows.
  # tour-joined says how to stop following: with the command, or tour-joined-menu while menu.access lets only the menu
  # through.
  # The moderation on the admin page (camplugin.followadmin): tour-restrict-... / tour-unrestrict-... tell the admin
  # ({player} is the player), tour-restricted-now, -changed and tour-unrestricted-now the player ({player} is the
  # admin). tour-restricted-lead and -join answer him when a restriction keeps him from inviting or accepting ({time}
  # and {reason} as with /cam ban), tour-restricted-guest the leader who would invite him. {what} lists
  # tour-restriction-lead and -join, joined by tour-restriction-separator. Following switched off for everybody:
  # tour-off-done, -changed and tour-on-done tell the admin; tour-disabled-now, -changed and tour-enabled-now every
  # player but those with camplugin.followadmin.bypass; tour-disabled and tour-disabled-guest in place of
  # tour-restricted-....
