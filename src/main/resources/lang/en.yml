  menu-admin-flights-all: "&eShow all flights"
  menu-admin-flights-title: "&8Flights of {player}"
  menu-admin-list: "&bWho is in cam mode"
  menu-admin-list-actions: "&eLeft-click: teleport to the camera\n&eRight-click: teleport to the body"
  menu-admin-list-empty: "&7Nobody is in cam mode."
  menu-admin-list-lore: "&7See who is flying right now\n&7and teleport to them."
  menu-admin-list-title: "&8Who is in cam mode"
