  cam-area-limit: "&cCam mode is not allowed in {area}."
  cam-area-start: "&cYou can't start cam mode in {area}."
  cam-body-blocked: "&cCam mode can't start here: your body can't be placed."
  # cam-commands: {command} is the command as he typed it, without the /.
  cam-command-blocked: "&cYou can't use /{command} in cam mode."
  cam-effect-start: "&cYou can't start cam mode with {effect}."
  cam-falling-start: "&cYou can't start cam mode while falling."
