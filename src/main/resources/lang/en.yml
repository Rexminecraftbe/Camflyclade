  # /cam spot (viewpoints): {spot} is the name of the spot - Owner:spot for one of another player -, {max}
  # viewpoints.max-per-player, {area} as in cam-area-limit, {distance} camera-mode.max-distance, {likes} how many
  # like a public spot. spot-jumped comes in the action bar. Behind each line of spot-list-entry stand spot-list-public
  # while it is public, spot-list-shared while players accepted it and spot-list-offered while it waits for players to
  # accept it, {players} being who, and the buttons spot-button-go, spot-button-share and spot-button-delete, and what
  # hovering over them says. Below them the spots others share with him (spot-list-shared-header and
  # spot-list-shared-entry), the public spots of others (spot-list-public-...), both with spot-button-go and
  # spot-button-visit - and spot-button-like or -unlike for a public one -, and what others offer him
  # (spot-list-offers-...), with spot-button-accept and spot-button-decline; {owner} is whose it is.
  # spot-offered-to-you tells a player online that a spot is offered to him, with the same two buttons; its owner hears
  # with spot-accepted-owner or spot-declined-owner what came of it. spot-removed: he took a spot he had accepted off
  # his list. spot-too-far: in cam mode, the spot is out of reach of the camera; spot-start-too-far: out of cam mode,
  # the spot is further than viewpoints.start-distance, {blocks} being by how much.
  spot-accepted: "&aYou accepted {spot}: you find it among the spots shared with you."
  spot-accepted-owner: "&a{player} accepted your spot {spot}."
