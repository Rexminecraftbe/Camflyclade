# CamFly - language file: English
# Which language file is used is set in config.yml under language.
# For another language copy this file, e.g. as de.yml, translate it and set language: de there.
# Whatever a language file leaves out comes from the English one built into the plugin.
# Reload with /cam reload.

# Texts the plugin sends (colour codes with &)
messages:
  actionbar-distance: "&aBody: &f{distance} blocks &e{arrow}"
  actionbar-distance-portal: "&aPortal: &f{distance} blocks &e{arrow}"
  actionbar-off: "&cCam mode ended"
  # {hint} is replaced by actionbar-hint while exit-key is on, and {key} there by the key that swaps
  # the hands - the one the player has bound it to, F unless changed. While exit-key is off it is
  # replaced by actionbar-hint-command.
  actionbar-hint: " &7- &f{key} &7or type &f/cam &7to leave"
  actionbar-hint-command: " &7- type &f/cam &7to leave"
  actionbar-on: "&aCam mode activated{hint}"
  # With camera-mode.max-distance-mode: signal behind actionbar-distance: {bars} are four bars, as many of them lit
  # as the signal is strong, {percent} how strong it is.
  actionbar-signal: " &7| &fSignal {bars} &7{percent}%"
  # {time} is afk-end.seconds.
  afk-ended: "&cCam mode ended: you did not move for {time}."
  # How {area} names a world of cam-area.forbidden-worlds, {world} being its name.
  area-world: "the world {world}"
  # The hearts over or under the name of the body with body.health-visible: true, on Spigot only - Paper shows the
  # hearts of the bar instead, which letters cannot: health-full for each whole heart, health-half for a half one at
  # the end, with body.health-show-missing health-empty for each heart the player is missing, and with
  # body.health-show-absorption the yellow ones of absorption.
  armorstand.health-absorbing-full: "&e❤"
  armorstand.health-absorbing-half: "&e❥"
  armorstand.health-empty: "&8❤"
  armorstand.health-full: "&c❤"
  armorstand.health-half: "&c❥"
  armorstand.name-format: "{player}'s Body"
  back-not-in-cam: "&cYou are not in cam mode."
  back-off: "&c/cam back is switched off."
  back-to-body: "&aBack at your body"
  # /cam ban: {time} is ban-for or ban-for-good, {reason} is ban-reason or nothing when no reason was given,
  # {player} who was banned or who banned, {by} who banned.
  ban-done: "&a{player} is banned from cam mode {time}{reason}."
  ban-everybody-done: "&aCam mode is locked for everybody {time}{reason}."
  ban-for: "for {time}"
  ban-for-good: "for good"
  ban-off: "&c/cam ban is switched off."
  ban-reason: " ({reason})"
  ban-unknown-player: "&cNobody called {player} has been on this server."
  ban-usage: "&eUse /cam ban <player|all> [time] [reason], /cam unban <player|all> or /cam banlist. A time is e.g. 30m, 2h or 7d."
  banlist-empty: "&eNobody is banned from cam mode."
  banlist-entry: "&7- &f{player}&7: {time}, by {by}{reason}"
  banlist-everybody: "&7- &fEverybody&7: {time}, by {by}{reason}"
  banlist-header: "&eBanned from cam mode ({count}):"
  banned: "&cYou are banned from cam mode {time}{reason}."
  banned-everybody: "&cCam mode is locked for everybody {time}{reason}."
  banned-everybody-now: "&c{player} locked cam mode for everybody {time}{reason}."
  banned-now: "&c{player} banned you from cam mode {time}{reason}."
  battery-bossbar: "Battery: {time}"
  battery-bossbar-charging: "Battery charging: {charge}, full in {time}"
  battery-empty: "&cCam mode ended: the battery is empty."
  battery-low: "&cThe battery holds {charge} of flight, a start needs {needed}. Ready again in {time}."
  # {mob} as mob-names has it, {player} the player's name, {distance} how far from the body in blocks.
  body-alarm-mob: "&cWatch out: {mob} is after your body!"
  body-alarm-player: "&cWatch out: {player} is close to your body!"
  body-attacked: "&cYour body was attacked by {damager}! Camera mode ended."
  body-drowning: "&cYour body is drowning! Camera mode ended."
  body-env-damage: "&cYour body was damaged by {cause}! Camera mode ended."
  body-got-effect: "&cYour body was hit by the effect {effect}! Camera mode ended."
  body-moved: "&cYour body was moved! Camera mode ended."
  body-suffocating: "&cYour body is stuck and suffocating! Camera mode ended."
  bossbar-text: "Cam mode ends in: %time%"
  cam-area-limit: "&cYou cannot go any further, cam mode is not allowed in {area}."
  cam-area-start: "&cYou cannot start cam mode in {area}."
  cam-effect-start: "&cYou cannot start cam mode with {effect} on you."
  cam-falling-start: "&cYou cannot start cam mode while falling."
  # The buttons behind each line of /cam list, see cam-list.teleport and cam-list.stop, and what hovering over them says.
  cam-list-body: "&a[Body]"
  cam-list-body-hover: "&7Teleport next to the body of {player}"
  cam-list-camera: "&b[Camera]"
  cam-list-camera-hover: "&7Teleport to the camera of {player}"
  cam-list-empty: "&eNobody is in cam mode."
  cam-list-entry: "&7- &f{player}&7: for {time}, {distance} blocks from the body"
  cam-list-entry-away: "&7- &f{player}&7: for {time}, in another world than the body"
  cam-list-header: "&eIn cam mode ({count}):"
  cam-list-stop: "&c[Stop]"
  cam-list-stop-hover: "&7End the cam mode of {player}"
  cam-lava-start: "&cYou cannot start cam mode in lava."
  cam-powder-snow-start: "&cYou cannot start cam mode in powder snow."
  cam-safety: "§cYou cannot start cam mode! You must remain safe for %seconds% more seconds."
  cam-spectator-start: "&cYou cannot start cam mode in spectator mode."
  cam-tp-body: "&aTeleported next to the body of {player}."
  cam-tp-camera: "&aTeleported to the camera of {player}."
  cam-tp-cannot-fly: "&cYou can only go to a camera while you can fly."
  cam-tp-not-in-cam: "&c{player} is not in cam mode."
  cam-tp-self: "&cThat is your own camera. Use /cam back to go back to your body."
  cam-tp-usage: "&eUse /cam tp <player> camera or /cam tp <player> body."
  cam-water-start: "&cYou cannot start cam mode in water."
  camera-off: "&aCamera mode ended."
  camera-on: "&aCamera mode activated! Use /cam again to exit."
  cant-attack-other-body: "&cYou cannot attack other bodies in camera mode."
  cant-fly-in-lava: "&cYou cannot fly into lava in camera mode."
  cant-fly-in-powder-snow: "&cYou cannot fly into powder snow in camera mode."
  cant-fly-in-water: "&cYou cannot fly into water in camera mode."
  config-allowed-blocks: "any block, e.g. barrier or glass"
  config-allowed-colors: "a colour as \"#RRGGBB\", e.g. \"#9fffb0\""
  config-allowed-pack-address: "an address such as mc.example.com, or with a port such as mc.example.com:25565"
  config-allowed-pack-port: "game, or a port from 1 to 65535"
  config-allowed-particles: "a particle without extra data, e.g. soul_fire_flame, flame or end_rod"
  config-allowed-post-effects: "false, or a post effect such as minecraft:blur or mypack:noise (signal.noise also camfly)"
  config-allowed-sounds: "a sound as /playsound names it, e.g. block.beacon.activate"
  config-broken: "&cThe configuration has an error in {file} and was not applied, the previous settings stay in effect: {error}"
  config-broken-startup: "&cThe configuration has an error in {file}: {error}"
  config-start-failed: "&cStartup failed. To enable the plugin, fix the error in the configuration and restart the server."
  config-entry-in-both-lists: "&cThe entry '{value}' is in {path} and in {other}. It is ignored in both."
  config-error-header: "&cThe configuration has {count} invalid entries:"
  config-error-header-single: "&cThe configuration has one invalid entry:"
  config-error-more: "&c... and {count} more. All of them are in the server console."
  config-expected-amounts: "&cWrong value for {path}: '{value}'. Expected entries such as name: number. Using {used} instead."
  config-expected-boolean: "&cWrong value for {path}: '{value}'. Expected true or false. Using {used} instead."
  config-expected-list: "&cWrong value for {path}: '{value}'. Expected a list. Using {used} instead."
  config-expected-number: "&cWrong value for {path}: '{value}'. Expected a number. Using {used} instead."
  config-expected-text: "&cWrong value for {path}: '{value}'. Expected text. Using {used} instead."
  config-expected-whole-number: "&cWrong value for {path}: '{value}'. Expected a whole number. Using {used} instead."
  config-out-of-range: "&cValue for {path} is out of range: {value}. Using {used} instead."
  config-syntax-extra-colon: 'there is one ":" too many here, or the value belongs in quotes'
  config-syntax-indentation: "the indentation here does not match the lines above"
  config-syntax-missing-colon: 'a "-" at the start of the line or a ":" after the name is missing here'
  config-syntax-missing-quote: "the closing quote is missing here"
  config-syntax-spot: "line {line}, column {column}"
  config-syntax-tab: "there is a tab here, indent with spaces only"
  config-syntax-unreadable: "unreadable"
  config-too-large: "&cValue for {path} is too large: {value}. Using {max} instead."
  config-too-small: "&cValue for {path} is too small: {value}. Using {min} instead."
  config-unknown-entry: "&cUnknown entry in {path}: '{value}'. It is ignored."
  config-unknown-key: "&cUnknown setting {path}. It is ignored, check its spelling and indentation."
  config-unknown-value: "&cUnknown value for {path}: '{value}'. Allowed: {allowed}. Using {used} instead."
  # Who {player} in stopped-by, banned-now and banlist is when the command comes from the console.
  console-name: "the server"
  cooldown-available: "&aCam mode available again"
  # The bossbar of time-limit.show-bossbar-cooldown, {time} is the time left.
  cooldown-bossbar: "Cam mode again in: {time}"
  crash-restored: "&eThe server went down while you were in cam mode. You got your things back and are at your body again."
  cooldown-text: "You can start cam mode again in %time%."
  # The parts of start-cost that cost-missing and cost-paid list, one after the other.
  cost-item: "{amount}x {item}"
  cost-level: "1 XP level"
  cost-levels: "{amount} XP levels"
  cost-point: "1 XP point"
  cost-points: "{amount} XP points"
  cost-missing: "&cStarting cam mode costs {cost}. You are missing {missing}."
  cost-paid: "&7Cam mode cost you {cost}."
  distance-from-body: "your body"
  distance-from-portal: "the portal you came out of"
  distance-limit: "&cYou cannot move further than {distance} blocks from {from}!"
  # {time} is the time left; end-warning-afk comes at afk-end.warning-percent.
  end-warning-afk: "&eYou are not moving: cam mode ends in {time}"
  end-warning-battery: "&eBattery almost empty: {time} left"
  end-warning-time-limit: "&eCam mode ends in {time}"
  flight-speed: "&bFlight speed: &f{speed}x"
  hitbox.name-format: "&c[HITBOX] {player}"
  no-permission: "&cYou don't have permission to use this command."
  no-player: "&cThis command can only be used by players."
  no-projectiles: "&cYou cannot shoot projectiles in camera mode."
