  menu-admin-ban-reason-question: "&eType the ban reason for {player} in chat (&f{cancel}&e to abort)."
  menu-admin-ban-reason-question-form: "Ban reason for {player}"
  menu-admin-ban-time-actions: "&eLeft-click: +1\n&eRight-click: -1\n&eShift: ±{step}"
  menu-admin-ban-time-actions-bedrock: "&eTap: ±1 or ±{step}"
