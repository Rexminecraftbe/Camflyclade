# CamFly - language file: English
# Which language file is used is set in config.yml under language.
# For another language copy this file, e.g. as de.yml, translate it and set language: de there.
# Whatever a language file leaves out comes from the English one built into the plugin.
# Reload with /cam reload.

# Texts the plugin sends (colour codes with &)
messages:
  actionbar-distance: "&aBody: &f{distance} blocks &e{arrow}"
  actionbar-distance-portal: "&aPortal: &f{distance} blocks &e{arrow}"
  actionbar-off: "&cCam mode ended"
  # {hint} is replaced by actionbar-hint while exit-key is on, and {key} there by the key that swaps
  # the hands - the one the player has bound it to, F unless changed. While exit-key is off it is
  # replaced by actionbar-hint-command. Players on Bedrock, who have no such key (see bedrock in config.yml), get
  # actionbar-hint-bedrock in place of actionbar-hint.
  actionbar-hint: " &7- &f{key} &7or &f/cam &7to leave"
  actionbar-hint-command: " &7- &f/cam &7to leave"
  actionbar-hint-bedrock: " &7- &f/cam &7to leave"
  actionbar-on: "&aCam mode activated{hint}"
  # With camera-mode.max-distance-mode: signal behind actionbar-distance. {icon} is the ping icon of the game, as the
  # tab list shows a connection: one bar to five, or a red cross once the signal is gone - on Spigot, which cannot show
  # it, the bars of {bars} instead. {quality} says it in a word (signal-quality-excellent to signal-quality-none),
  # {bars} are four bars, as many of them lit as the signal is strong, {percent} how strong it is.
  actionbar-signal: " &7| {icon} &7Signal: {quality}"
  # {time} is afk-end.seconds.
  afk-ended: "&cCam mode ended: inactive for {time}."
  # How {area} names a world of cam-area.forbidden-worlds, {world} being its name.
  area-world: "the world {world}"
  # The hearts over or under the name of the body with body.health-visible: true, on Spigot only - Paper shows the
  # hearts of the bar instead, which letters cannot: health-full for each whole heart, health-half for a half one at
  # the end, with body.health-show-missing health-empty for each heart the player is missing, and with
  # body.health-show-absorption the yellow ones of absorption.
  armorstand.health-absorbing-full: "&e❤"
  armorstand.health-absorbing-half: "&e❥"
  armorstand.health-empty: "&8❤"
  armorstand.health-full: "&c❤"
  armorstand.health-half: "&c❥"
  armorstand.name-format: "{player}'s Body"
  back-not-in-cam: "&cOnly in cam mode."
  back-off: "&c/cam back is switched off."
  back-to-body: "&aBack at your body"
  # /cam ban: {time} is ban-for or ban-for-good, {reason} is ban-reason (in /cam banlist banlist-reason) or nothing
  # when no reason was given; a ban for good with a reason leaves {time} out, "because:" says enough then (but not in
  # /cam banlist). {player} is who was banned or who banned, {by} who banned. Banning again whom a ban holds
  # already changes his ban: then ban-changed and ban-everybody-changed come instead, and whom it holds learns how it
  # changed - banned-changed-longer or -shorter by {diff} (in whole minutes), now lasting {time} until {date} (as
  # ban-date writes it, a pattern of Java's DateTimeFormatter, in the time zone of the server), -forever when it is
  # for good now, -until when it was for good and is not any more, else -now. The same for everybody:
  # banned-everybody-changed-...
  ban-changed: "&a{player} is now banned from cam mode {time}{reason}."
  ban-date: "yyyy-MM-dd HH:mm"
  ban-done: "&a{player} is banned from cam mode {time}{reason}."
  ban-everybody-changed: "&aEverybody is now banned from cam mode {time}{reason}."
  ban-everybody-done: "&aEverybody is banned from cam mode {time}{reason}."
  ban-for: "for {time}"
  ban-for-good: "permanently"
  ban-off: "&c/cam ban is switched off."
  ban-reason: " because: {reason}"
  ban-unknown-player: "&cUnknown player: {player}"
  ban-usage: "&eUse /cam ban <player|all> [time] [reason], /cam unban <player|all> or /cam banlist. Time e.g. 30m, 2h, 7d."
  banlist-empty: "&eNobody is banned."
  banlist-entry: "&7- &f{player}&7: {time}, by {by}{reason}"
  banlist-everybody: "&7- &fEverybody&7: {time}, by {by}{reason}"
  banlist-header: "&eBanned ({count}):"
  banlist-reason: " ({reason})"
  banned: "&cYou are banned from cam mode {time}{reason}."
  banned-changed-forever: "&c{player} made your cam mode ban permanent."
  banned-changed-longer: "&c{player} extended your cam mode ban by {diff}: now {time}, until {date}."
  banned-changed-now: "&c{player} changed your ban: banned from cam mode {time}{reason}."
  banned-changed-shorter: "&a{player} shortened your cam mode ban by {diff}: now {time}, until {date}."
  banned-changed-until: "&a{player} made your cam mode ban temporary: it ends on {date}."
  banned-everybody: "&cEverybody is banned from cam mode {time}{reason}."
  banned-everybody-changed-forever: "&c{player} made the cam mode ban for everybody permanent."
  banned-everybody-changed-longer: "&c{player} extended the cam mode ban for everybody by {diff}: now {time}, until {date}."
  banned-everybody-changed-now: "&c{player} changed the ban for everybody: banned from cam mode {time}{reason}."
  banned-everybody-changed-shorter: "&a{player} shortened the cam mode ban for everybody by {diff}: now {time}, until {date}."
  banned-everybody-changed-until: "&a{player} made the cam mode ban for everybody temporary: it ends on {date}."
  banned-everybody-now: "&c{player} banned everybody from cam mode {time}{reason}."
  banned-now: "&c{player} banned you from cam mode {time}{reason}."
  battery-bossbar: "Battery: {time}"
  battery-bossbar-charging: "Battery charging: {charge}, full in {time}"
  battery-empty: "&cCam mode ended: battery empty."
  battery-low: "&cBattery too low: {charge}, a start needs {needed}. Ready in {time}."
  # What players on Bedrock get in place of what Bedrock cannot do, see bedrock in config.yml. bedrock-chat-command
  # stands behind every button in the chat (bedrock.chat-commands): the chat of Bedrock cannot be clicked, so it
  # says the command to type, {command}; one that needs more after it, such as a name, ends in ... The
  # bedrock-form-... texts are the windows that ask about a spot offered to them and about an invitation to follow
  # (bedrock.invitation-forms): their title and their two buttons; the text in them is spot-offered-to-you or
  # tour-invitation. While menu.access lets only the menu through, those two have bedrock-chat-menu behind them in
  # place of their buttons: the answer goes through the menu.
  bedrock-chat-command: " &8(&7{command}&8)"
  bedrock-chat-menu: " &8(&7answer in /cam menu&8)"
  bedrock-form-follow-accept: "Follow"
  bedrock-form-follow-decline: "Decline"
  bedrock-form-follow-title: "Invitation to follow"
  bedrock-form-spot-offer-accept: "Accept"
  bedrock-form-spot-offer-decline: "Decline"
  bedrock-form-spot-offer-title: "Spot offered"
