  signal-back-to-body: "&cSignal lost: back at your body"
  signal-ended: "&cCam mode ended: the signal was lost."
  signal-lost: "&cSignal lost! &7Fly back within {time}"
  # start-delay: the countdown in the action bar, {time} being the time left, and why the start was called off.
  start-delay-cancelled: "&eCam mode start cancelled."
  start-delay-countdown: "&eCam mode in {time} &7- stand still"
  start-delay-damaged: "&cCam mode start cancelled: you took damage."
  start-delay-moved: "&cCam mode start cancelled: you moved."
  startup-skins-failed: "Skins could not be preloaded at startup: {error}"
  startup-skins-loaded: "Skins loaded successfully."
  startup-skins-loading: "Loading skins..."
  stats-battery: "&7Battery: &f{charge} &7of &f{capacity}"
  stats-cooldown: "&7Cam mode again in: &f{time}"
  stats-distance: "&7Distance flown: &f{distance} blocks"
  stats-farthest: "&7Farthest from the body: &f{distance} blocks"
  stats-header: "&eCam mode statistics of {player}:"
  stats-longest: "&7Longest flight: &f{time}"
  stats-none: "&e{player} has not been in cam mode yet."
  stats-off: "&cThe statistics are switched off."
  stats-reset: "&aYour cam mode statistics have been reset."
  stats-sessions: "&7Times in cam mode: &f{count}"
  stats-total-time: "&7Time in cam mode: &f{time}"
  stats-unknown-player: "&cNobody called {player} has been on this server."
  stats-usage: "&eUse /cam stats, /cam stats reset or /cam stats player <name>."
  stop-all-done: "&aEnded the cam mode of {count} players."
  stop-done: "&aEnded the cam mode of {player}."
  stop-none: "&eNobody is in cam mode."
  stop-not-in-cam: "&c{player} is not in cam mode."
  stop-off: "&c/cam stop is switched off."
  stop-usage: "&eUse /cam stop <player> or /cam stop all."
  stopped-by: "&cYour cam mode was ended by {player}."
  teleport-arrival-ended: "&c{player} was teleported to you. Camera mode ended."
  teleport-ended: "&cYou were teleported. Camera mode ended."
  time-limit-expired: "&cCam mode ended: Time limit expired."
  # /cam trail: {number} which of the kept flights (1 the newest), {distance} in blocks, {time} how long the flight
  # took, {when} trail-flying or trail-ago (with {time} how long ago it ended), {place} as trail-place has it, {world}
