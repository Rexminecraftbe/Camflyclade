  cost-item: "{amount}x {item}"
  cost-level: "1 XP level"
  cost-levels: "{amount} XP levels"
  cost-point: "1 XP point"
  cost-points: "{amount} XP points"
  cost-missing: "&cStarting cam mode costs {cost}. You are missing {missing}."
  cost-paid: "&7Cam mode cost you {cost}."
  distance-from-body: "your body"
  distance-from-portal: "the portal you came out of"
  distance-from-visit: "the spot you visit"
  distance-limit: "&cYou cannot move further than {distance} blocks from {from}!"
  # {time} is the time left; end-warning-afk comes at afk-end.warning-percent.
  end-warning-afk: "&eYou are not moving: cam mode ends in {time}"
  end-warning-battery: "&eBattery almost empty: {time} left"
  end-warning-time-limit: "&eCam mode ends in {time}"
  flight-speed: "&bFlight speed: &f{speed}x"
  hitbox.name-format: "&c[HITBOX] {player}"
  # /cam menu (menu): the names of the buttons, and under each the text of the same name with -lore after it (\n
  # begins a new line). The spots have three tabs, menu-spots-tab-private, -public and -shared, each page with a title
  # of its own (menu-spots-title-...); menu-spot-created says when a spot was saved ({date} as menu-admin-flight-date
  # writes it), menu-spots-offers how many spots wait for him to accept them, menu-spot-public-lore that one of his
  # own is public ({likes}); menu-spot-visit-action stands under the spots of others while visitor-camera is on.
  # menu-spot-reach-lore stands under every spot that can be jumped to: how close one has to be to jump there.
  # menu-spot-views: how often the spot was looked at ({views}): every jump and every visit, by anybody, the same
  # player at the same spot once in viewpoints.views-cooldown-minutes at most, which menu-spot-views-hint says under
  # it ({minutes}; not at 0, when every jump counts).
  # menu-new-spot-count says on the button of a new spot how many spots he has ({count}), may have ({max},
  # viewpoints.max-per-player) and may still save ({left}); -full once there is no room left, -unlimited without a
  # limit. menu-sort is the button that sorts a list, {sort} being one of the menu-sort-... orders; under it every
  # order, the one in use as menu-sort-option-current, the others as menu-sort-option. menu-tour-... are the page
  # of /cam tour, menu-tour-view the button that switches between the guide's view and looking round freely.
  # menu-only is what the commands say under menu.access or menu.admin-access: menu, menu-features-off under false. menu-spot-name asks for the name of a new spot in the chat,
  # menu-admin-ban-reason-question why a player is banned ({player}), {cancel} being the word that calls either off,
  # with menu-answer-cancelled. Under menu-stats and the heads of menu-admin-stats stand the lines of /cam stats;
  # menu-admin-cam-lore and -away stand under the heads of who is in cam mode, like cam-list-entry. On the page of a
  # ban, menu-admin-ban-days, -hours and -minutes say how many of them the ban has ({amount}), with
  # menu-admin-ban-time-lore under them ({time} as ban-for or ban-for-good), menu-admin-ban-confirm-lore says what
  # the ban will be ({ban}: {time} with ban-reason), and menu-admin-banned how a ban stands; {step} in
  # menu-admin-ban-time-actions is menu.ban-shift-step. The -change ones are there instead while the player is banned
  # already: then the page changes his ban, and menu-admin-unban ({player} in its -lore) lifts it.
  menu-admin: "&cAdmin"
  menu-admin-ban: "&cBan"
  menu-admin-ban-change: "&cChange the ban"
  menu-admin-ban-change-confirm: "&4Change the ban"
  menu-admin-ban-change-lore: "&7Banned now: change\n&7how long and why."
  menu-admin-ban-change-title: "&8Change the ban of {player}"
  menu-admin-ban-confirm: "&4Ban"
  menu-admin-ban-confirm-lore: "&7{player}, {ban}"
  menu-admin-ban-days: "&eDays: &f{amount}"
  menu-admin-ban-forever: "&cFor good"
  menu-admin-ban-hours: "&eHours: &f{amount}"
  menu-admin-ban-lore: "&7Pick how long and why."
  menu-admin-ban-minutes: "&eMinutes: &f{amount}"
  menu-admin-ban-no-reason: "&7none"
  menu-admin-ban-reason: "&fReason"
  menu-admin-ban-reason-actions: "&eLeft-click: write one in the chat\n&eRight-click: none"
  menu-admin-ban-reason-question: "&eType in the chat why {player} is banned, or {cancel}."
  menu-admin-ban-time-actions: "&eLeft-click: +1\n&eRight-click: -1\n&eWith shift: {step} at once"
  menu-admin-ban-time-lore: "&7Altogether: &f{time}"
  menu-admin-ban-title: "&8Ban {player}"
  menu-admin-banned: "&cBanned {ban}"
  menu-admin-cam-lore: "&7In cam mode for {time},\n&7{distance} blocks from the body"
  menu-admin-cam-lore-away: "&7In cam mode for {time},\n&7in another world than the body"
  menu-admin-everybody-cam: "&7{count} in cam mode"
  menu-admin-everybody-name: "Everybody"
  # The flights of a player on the admin page: menu-admin-flight with {number} (1 the newest) and {date}, when it
  # began as menu-admin-flight-date writes it (a pattern of Java's DateTimeFormatter, e.g. dd.MM.yyyy HH:mm), and
  # under it menu-admin-flight-lore with {time} how long it took, {distance} in blocks, {from} where the body stood and
  # {to} where the camera was last, both as trail-place has them.
  menu-admin-flight: "&f#{number} &7- &f{date}"
  menu-admin-flight-actions: "&eLeft-click: show it\n&eRight-click: show it and go to its start"
  menu-admin-flight-date: "yyyy-MM-dd HH:mm"
