  # /cam menu (menu): the names of the buttons, and under each the text of the same name with -lore after it (\n
  # begins a new line). The spots have three tabs, menu-spots-tab-private, -public and -shared, each page with a title
  # of its own (menu-spots-title-...); menu-spot-created says when a spot was saved ({date} as menu-admin-flight-date
  # writes it), menu-spots-offers how many spots wait for him to accept them, menu-spot-public-lore that one of his
  # own is public ({likes}).
  # menu-spot-reach-lore stands under every spot that can be jumped to: how close one has to be to jump there.
  # menu-spot-views: how often the spot was looked at ({views}): every jump, by anybody, the same
  # player at the same spot once in viewpoints.views-cooldown-minutes at most, which menu-spot-views-hint can say under
  # it ({minutes}; empty, as it is here, for nothing, and never at 0, when every jump counts). menu-guestbook is the bell on the pages of the spots that sets
  # how the guestbook (viewpoints.guestbook) tells him of his spots, {mode} being menu-guestbook-on, -login or -off;
  # under it every way, the one he set as menu-guestbook-option-current, the others as menu-guestbook-option, then
  # menu-guestbook-interval - how often "on" tells him while he plays ({minutes},
  # viewpoints.guestbook-interval-minutes) - and menu-guestbook-action. While a restriction keeps him from looking at
  # the public spots or at those shared by name, menu-guestbook-locked stands there instead.
  # menu-new-spot-count says on the button of a new spot how many spots he has ({count}), may have ({max},
  # viewpoints.max-per-player) and may still save ({left}); -full once there is no room left, -unlimited without a
  # limit. menu-sort is the button that sorts a list, {sort} being one of the menu-sort-... orders; under it every
  # order, the one in use as menu-sort-option-current, the others as menu-sort-option. menu-time, menu-weather and
  # menu-nightvision are stepped through on their button, without a page of their own and without the menu closing:
  # {time} is one of menu-time-reset, -day, -noon, -sunset, -night, -midnight, -sunrise or menu-time-ticks for a time
  # without a name ({ticks}), {weather} one of menu-weather-reset, -clear or -rain, {mode} one of
  # menu-nightvision-reset - {mode} there being the mode of night-vision.mode, as menu-nightvision-on, -dark or -off
  # name it -, -on, -dark or -off; under the -lore every one of them, the one that holds now as
  # menu-choice-option-current, the others as menu-choice-option ({choice}), then menu-choice-action.
  # menu-tour-... are the page of /cam follow (the keys keep the name it had, tour), menu-tour-view the button that
  # switches between the leader's view and looking round freely; menu-tour-lead-restricted and
  # menu-tour-join-restricted what keeps him from leading or following, menu-tour-disabled that following is
  # switched off ({time} and {reason} as with /cam ban);
  # menu-tour-candidate-restricted- and -disabled-lore under a player he cannot invite for that;
  # menu-tour-candidate-invited-lore under one whose invitation still holds ({expires}, the seconds it still does),
  # -wait-lore under one he may not invite again yet (follow.invite-cooldown-seconds, {seconds} left).
  # menu-only is what the commands say under menu.access or menu.admin-access: menu, menu-features-off under false and
  # when what the command is for is switched off in config.yml. menu-spot-name asks for the name of a new spot in the chat,
  # menu-admin-ban-reason-question why a player is banned ({player}), {cancel} being the word that calls either off,
  # with menu-answer-cancelled. Under menu-stats and the heads of menu-admin-stats stand the lines of /cam stats;
  # menu-admin-cam-lore and -away stand under the heads of who is in cam mode, like cam-list-entry. On the page of a
  # ban, menu-admin-ban-days, -hours and -minutes say how many of them the ban has ({amount}), with
  # menu-admin-ban-time-lore under them ({time} as ban-for or ban-for-good), menu-admin-ban-confirm-lore says what
  # the ban will be ({ban}: {time} with ban-reason), and menu-admin-banned how a ban stands; {step} in
  # menu-admin-ban-time-actions is menu.ban-shift-step. The -change ones are there instead while the player is banned
  # already: then the page changes his ban, and menu-admin-unban ({player} in its -lore) lifts it.
  # On Bedrock (see bedrock in config.yml) there is but one click, a tap: a button that does something else on a
  # right-click or with shift offers what it does on a page of its own, menu-pick-title ({button} its name - the
  # chest itself keeps menu-title as its title there, like every page on Bedrock), each
  # as menu-pick with one of the menu-pick-... texts for {pick} - a button that steps through choices offers every
  # choice, the one that holds now as menu-pick-current -, and menu-pick-back leads back. The texts with -bedrock
  # after their key stand in place of the ones without it there, saying a tap instead of the clicks; with
  # bedrock.menu: forms the ones with -forms after their key come first, where a window, a list, has no left or
  # right to point at - {button} in them is the name of the button meant. With
  # bedrock.menu: mixed (and forms, where the whole menu is windows of Bedrock) the choices and the questions come
  # in a window of Bedrock: the title of the window of the choices is the name of the button; over the line to type
  # into stands the text with -form after the key of the question, menu-form-placeholder in it.
  menu-admin: "&cAdmin"
  menu-admin-ban: "&cBan"
  menu-admin-ban-change: "&cChange ban"
  menu-admin-ban-change-confirm: "&4Change ban"
  menu-admin-ban-change-lore: "&7Change duration or reason."
  menu-admin-ban-change-title: "&8Change ban: {player}"
  menu-admin-ban-confirm: "&4Ban"
  menu-admin-ban-confirm-lore: "&7{player}, {ban}"
