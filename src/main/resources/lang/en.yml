  config-expected-amounts: "&cWrong value for {path}: '{value}'. Expected entries such as name: number. Using {used} instead."
  config-expected-boolean: "&cWrong value for {path}: '{value}'. Expected true or false. Using {used} instead."
  config-expected-list: "&cWrong value for {path}: '{value}'. Expected a list. Using {used} instead."
  config-expected-number: "&cWrong value for {path}: '{value}'. Expected a number. Using {used} instead."
  config-expected-text: "&cWrong value for {path}: '{value}'. Expected text. Using {used} instead."
  config-expected-whole-number: "&cWrong value for {path}: '{value}'. Expected a whole number. Using {used} instead."
  config-not-descending: "&cThe values of {path} have to go down, each lower than the one before: {value}. Using {used} instead."
  config-out-of-range: "&cValue for {path} is out of range: {value}. Using {used} instead."
  config-syntax-extra-colon: 'there is one ":" too many here, or the value belongs in quotes'
  config-syntax-indentation: "the indentation here does not match the lines above"
  config-syntax-missing-colon: 'a "-" at the start of the line or a ":" after the name is missing here'
  config-syntax-missing-quote: "the closing quote is missing here"
  config-syntax-spot: "line {line}, column {column}"
  config-syntax-tab: "there is a tab here, indent with spaces only"
  config-slot-taken: "&c{path}: slot {value} is taken by {other} already. Using slot {used} instead."
  config-syntax-unreadable: "unreadable"
  config-too-large: "&cValue for {path} is too large: {value}. Using {max} instead."
  config-too-small: "&cValue for {path} is too small: {value}. Using {min} instead."
  config-unknown-entry: "&cUnknown entry in {path}: '{value}'. It is ignored."
  config-unknown-key: "&cUnknown setting {path}. It is ignored, check its spelling and indentation."
  config-unknown-value: "&cUnknown value for {path}: '{value}'. Allowed: {allowed}. Using {used} instead."
  # Who {player} in stopped-by, banned-now and banlist is when the command comes from the console.
  console-name: "the server"
  cooldown-available: "&aCam mode available again"
  # The bossbar of time-limit.show-bossbar-cooldown, {time} is the time left.
