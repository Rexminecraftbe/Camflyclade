  cam-list-stop: "&c[Stop]"
  cam-list-stop-hover: "&7End {player}'s cam mode"
  cam-lava-start: "&cYou can't start cam mode in lava."
  # cam-safety.nearby-players: {player} is the nearest other player, {radius} cam-safety.nearby-radius - how far
