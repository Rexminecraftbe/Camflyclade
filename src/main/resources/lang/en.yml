  trail-button-all: "&b[all]"
  trail-button-all-hover: "&7Show all kept cam flights of {player} at once"
  trail-button-hover: "&7Show cam flight #{number} of {player}"
  trail-elsewhere: "&eNone of the flight is in your world, it is in {world}."
  trail-flights: "&7Kept flights:"
  trail-flying: "still in cam mode"
  trail-from: "&7From the body at &f{place}"
  trail-header: "&eCam flight #{number} of {player}: {distance} blocks in {time}, {when}"
  trail-hidden: "&aThe flight is hidden again."
  trail-no-such: "&e{player} has no cam flight #{number}, only {count} kept."
  trail-none: "&e{player} has no recorded cam flight."
  trail-off: "&c/cam trail is switched off."
  trail-place: "{x} {y} {z} ({world})"
  trail-shown: "&aShown for {time}, from green at the body to red at the camera. /cam trail hides it."
  trail-to: "&7Camera last at &f{place}"
  trail-usage: "&eUse /cam trail <player> [number|all] to show cam flights of a player, /cam trail to hide them."
  unban-done: "&a{player} may use cam mode again."
  unban-everybody-done: "&aCam mode is open for everybody again."
  unban-everybody-none: "&eCam mode is not locked for everybody."
  unban-not-banned: "&e{player} is not banned from cam mode."
  unbanned-everybody-now: "&aCam mode is open for everybody again."
  unbanned-now: "&aYou may use cam mode again."

# Names the texts above fill in for things of the game: damage types, mobs, effects, biomes,
# structures, dimensions and portals. Each list goes by the key of the game without the part up to
# the colon, so falling_anvil stands for minecraft:falling_anvil. Write each name so that it fits
# into the texts that use it.
# Something the lists do not have - because a newer version of the game, a data pack or another
# plugin adds it - you can simply add yourself, in the same way; /cam reload takes it over. Until
# then a text names it by its key, with spaces for the underscores, and a mob by the name the game
# gives it.

